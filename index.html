<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1b16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<title>常漢勝つぞ</title>
<style>
:root{
  --paper:#f5efe2; --card:#fbf8f0; --ink:#1f1b16; --sub:#6b6256; --hair:#d8ccb4;
  --shu:#c3362b; --shu-bg:#f5ddd6; --kin:#86631c; --kin-bg:#f1e6c8; --ai:#2b4c7e;
  --on-ink:#f5efe2; --on-shu:#ffffff; --track:#d8ccb4; --dot:rgba(120,90,40,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15130f; --card:#1d1a15; --ink:#efe6d4; --sub:#aa9f8c; --hair:#3b342a;
    --shu:#e35a4b; --shu-bg:#3b1c17; --kin:#d6ac52; --kin-bg:#3a2f15; --ai:#7fa3dc;
    --on-ink:#15130f; --on-shu:#15130f; --track:#756a57; --dot:rgba(255,240,210,.035);
  }
}
:root[data-theme="dark"]{
  --paper:#15130f; --card:#1d1a15; --ink:#efe6d4; --sub:#aa9f8c; --hair:#3b342a;
  --shu:#e35a4b; --shu-bg:#3b1c17; --kin:#d6ac52; --kin-bg:#3a2f15; --ai:#7fa3dc;
  --on-ink:#15130f; --on-shu:#15130f; --track:#756a57; --dot:rgba(255,240,210,.035);
}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--paper);color:var(--ink);
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:6px 6px;
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100dvh}
.serif,h1,.big,.q,.answer,.timer,.logo,.btn,.kn{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:23px;font-weight:900;letter-spacing:.06em;margin:6px 0 4px}
.muted{color:var(--sub);font-size:14px}
b{font-weight:700}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:2px;padding:16px;margin:14px 0}
.btn{display:block;width:100%;border:1.5px solid var(--ink);border-radius:2px;padding:15px 12px;font-size:19px;font-weight:900;letter-spacing:.12em;
  background:var(--ink);color:var(--on-ink);margin:10px 0;cursor:pointer;line-height:1.35}
.btn small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;font-size:12px;letter-spacing:.04em;opacity:.75;margin-top:2px}
.btn.sub{background:transparent;color:var(--ink);font-size:16px;letter-spacing:.08em}
.btn.ok{background:var(--shu);border-color:var(--shu);color:var(--on-shu)}
.btn.ng{background:transparent;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.mini{width:auto;flex:none;margin:0;min-height:44px;padding:10px 14px;font-size:14px;letter-spacing:.06em}
#quit{min-width:72px}
.row{display:flex;gap:10px;margin:10px 0}
.row>.btn{flex:1;font-size:16px;padding:14px 6px;white-space:nowrap;margin:0}
.banner{border:1.5px solid var(--kin);color:var(--kin);padding:10px 12px;font-size:14px;margin-top:10px}
/* 見出し */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.logo{font-weight:900;font-size:31px;letter-spacing:.08em;line-height:1;margin:0}
.dday{font-family:"Noto Serif JP",serif;font-size:13px;white-space:nowrap;text-align:right}
.dday b{font-size:24px;color:var(--shu);font-weight:900;margin:0 2px}
.subhead{color:var(--sub);font-size:13px;margin-top:6px}
/* 数字の箱 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{border:1.5px solid var(--ink);background:var(--card);padding:10px 12px;position:relative}
.kpi.wide{grid-column:1 / -1}
.cap{font-size:12px;letter-spacing:.1em;color:var(--sub)}
.big{font-size:42px;font-weight:900;line-height:1.08}
.big small{font-size:16px;font-weight:700;margin-left:2px}
.line{height:6px;background:var(--track);margin:8px 0 4px;position:relative}
.line i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .6s}
.line i.lo{background:color-mix(in srgb,var(--ink) 35%,var(--track))}
.line .goal-mark{position:absolute;top:-7px;bottom:-7px;border-left:2px solid var(--shu)}
.line .goal-mark span{position:absolute;bottom:100%;left:4px;font-size:12px;color:var(--shu);white-space:nowrap;font-weight:700;margin-bottom:1px}
.line .goal-mark.r span{left:auto;right:4px}
.kpi .foot{font-size:12px;color:var(--sub)}
.kpi.wide .line{margin-top:22px}
.kpi.wide .msg{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.kpi.wide .msg>div{flex:1}
/* 判子 */
.stamp{display:inline-flex;align-items:center;justify-content:center;text-align:center;border:3px solid var(--shu);color:var(--shu);border-radius:50%;
  font-family:"Noto Serif JP",serif;font-weight:900;line-height:1.1;transform:rotate(-12deg);background:color-mix(in srgb,var(--card) 70%,transparent)}
.kpi .stamp{position:absolute;right:10px;top:8px;width:58px;height:58px;font-size:13px}
.stamp.big-stamp{width:120px;height:120px;font-size:26px;border-width:5px;margin:6px auto 4px;display:flex;animation:press .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes press{0%{transform:scale(1.8) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
/* 区切り見出し */
.sec{margin:20px 0 8px;font-size:12px;letter-spacing:.25em;display:flex;align-items:center;gap:8px;color:var(--ink)}
.sec:after{content:"";flex:1;border-top:1px solid var(--ink)}
/* 種類・時間 */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink)}
.seg button{border:0;border-left:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:11px 4px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 0}
.stepper button{width:46px;height:46px;border:1.5px solid var(--ink);border-radius:2px;background:transparent;color:var(--ink);font-size:22px;font-weight:700;cursor:pointer;font-family:inherit}
.stepper b{font-family:"Noto Serif JP",serif;font-size:26px;font-weight:900;min-width:72px;text-align:center}
/* 札（ステージ） */
.fuda{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.fuda button{position:relative;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);height:104px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;font:inherit}
.fuda .v{writing-mode:vertical-rl;text-orientation:upright;font-family:"Noto Serif JP",serif;font-weight:900;font-size:14px;letter-spacing:.06em;white-space:nowrap}
.fuda small{font-size:12px;color:var(--sub);white-space:nowrap}
.fuda button.clr{background:var(--ink);color:var(--on-ink)}
.fuda button.clr small{color:var(--on-ink);opacity:.8}
.fuda button.now{border:2.5px solid var(--shu);color:var(--shu)}
.fuda button.now small{color:var(--shu)}
.fuda .seal{position:absolute;right:3px;top:-9px;width:24px;height:24px;border-radius:50%;background:var(--shu);color:var(--on-shu);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif JP",serif;transform:rotate(-10deg)}
.note{color:var(--sub);font-size:13px;text-align:center;margin-top:8px}
/* 成績の小箱 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:10px 0}
.stats>div+div{border-left:1px solid var(--hair)}
.stats b{display:block;font-family:"Noto Serif JP",serif;font-size:22px;font-weight:900}
.stats span{font-size:12px;color:var(--sub);letter-spacing:.08em}
/* 問題 */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:24px;min-width:64px}
.timer.low{color:var(--shu)}
.kind{display:inline-block;font-family:"Noto Serif JP",serif;font-size:13px;font-weight:900;padding:4px 12px;border:0;background:var(--ink);color:var(--on-ink);letter-spacing:.2em}
.kind.revive{background:var(--shu);color:var(--on-shu)}
.q{font-size:26px;font-weight:700;line-height:1.9;margin:14px 0 8px;word-break:break-all}
.q.solo{font-size:40px;font-weight:900;text-align:center;margin:22px 0 16px;letter-spacing:.08em}
.q u{text-decoration:none;border-bottom:3px solid var(--shu);padding:0 2px}
.ask{font-size:13px;color:var(--sub);letter-spacing:.04em}
input.ans{width:100%;font-family:"Noto Serif JP",serif;font-size:26px;padding:10px 4px;border:0;border-bottom:2px solid var(--ink);border-radius:0;
  background:transparent;color:var(--ink)}
input.ans:focus{outline:none;border-bottom-color:var(--shu)}
input.ans::placeholder{color:var(--sub);font-size:18px}
.answer{font-size:60px;font-weight:900;text-align:center;margin:6px 0;letter-spacing:.06em}
.full{text-align:center;color:var(--sub);font-size:16px}
.judge{padding:10px;margin:12px 0;font-weight:900;font-size:20px;text-align:center;font-family:"Noto Serif JP",serif;letter-spacing:.08em}
.judge.ok{color:var(--shu)}
.judge.ok:before{content:"";display:inline-block;width:28px;height:28px;border:4px solid var(--shu);border-radius:50%;vertical-align:-6px;margin-right:10px}
.judge.ng{color:var(--ink);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.judge.ng:before{content:"×";font-size:28px;margin-right:8px;vertical-align:-3px;-webkit-text-stroke:2px currentColor}
.combo{height:22px;line-height:22px;margin-top:4px;text-align:center;font-family:"Noto Serif JP",serif;font-weight:900;color:var(--shu);font-size:20px;letter-spacing:.1em}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
.sbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);font-weight:700;margin-top:10px}
.sbar span:first-child{font-family:"Noto Serif JP",serif;font-weight:900;color:var(--ink)}
.sbar div{flex:1;height:6px;background:var(--track);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.mean{border-left:3px solid var(--ink);padding:6px 12px;margin:0 0 8px;font-size:16px;line-height:1.6}
.ex>div,.mean{display:flex;align-items:baseline;gap:8px}
.mean b,.ex b{flex:none;font-size:12px;color:var(--sub);border:1px solid var(--sub);padding:0 6px;letter-spacing:.1em}
.ex>div>span,.mean>span{flex:1;min-width:0}
.ex{border-top:1px solid var(--hair);padding:10px 2px 2px;margin:12px 0 4px;font-size:16px;line-height:1.7;text-align:left}
.ex div+div{margin-top:6px}
.ex mark{background:transparent;color:var(--shu);font-weight:900}
/* 結果 */
.center{text-align:center}
.goal{font-family:"Noto Serif JP",serif;font-size:22px;font-weight:900;color:var(--shu);letter-spacing:.06em}
.plus{color:var(--shu);font-weight:700}
/* 図鑑 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.tile .rd{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;font-size:12px;line-height:1.3;margin-top:2px;word-break:break-all}
.tile{padding:8px 2px;text-align:center;font-family:"Noto Serif JP",serif;font-weight:900;font-size:15px;border:1px solid var(--hair);background:var(--card)}
.tile small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:12px;font-weight:500;color:var(--sub)}
.tile.s2{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.tile.s2 small{color:var(--on-ink);opacity:.75}
.tile.s1{border:1.5px solid var(--kin);color:var(--kin)}
.tile.s0{background:var(--shu-bg);border-color:var(--shu);color:var(--shu)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:0;position:sticky;top:0;z-index:2;background:var(--paper);padding:8px 0}
.legend i{display:inline-block;width:11px;height:11px;margin-right:4px;vertical-align:-1px;border:1px solid var(--hair)}
/* 紙吹雪（和紙の色） */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.wrap{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.stamp.big-stamp{animation:none}}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.hidden{display:none}
.tile{cursor:pointer;font:inherit;color:inherit}
.tile.later{border-style:dashed;border-color:var(--sub);opacity:.7}
.sheet{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:520px;margin:0;border-radius:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
/* めくり札 */
.fcard{min-height:300px;cursor:pointer;user-select:none;-webkit-user-select:none}
.fc-kind{display:inline-block;font-size:12px;border:1px solid var(--sub);color:var(--sub);padding:0 6px;letter-spacing:.15em}
.fc-hint{text-align:center;color:var(--sub);font-size:13px;margin-top:18px}
.fc-line{border-top:1px dashed var(--hair);margin:12px 0}
/* 手引き */
.tebiki{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 4px;padding:10px 14px 10px 10px;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-left:8px solid var(--ink);cursor:pointer;font:inherit;text-align:left;min-height:56px}
.tebiki:active{transform:translateY(1px)}
.tb-mark{flex:none;writing-mode:vertical-rl;font-family:"Noto Serif JP",serif;font-weight:900;font-size:13px;letter-spacing:.15em;background:var(--shu);color:var(--on-shu);padding:6px 3px}
.tb-txt{flex:1}
.tb-txt b{display:block;font-family:"Noto Serif JP",serif;font-weight:900;font-size:18px;letter-spacing:.12em}
.tb-txt small{color:var(--sub);font-size:12px}
.tb-arrow{font-size:26px;color:var(--sub)}
.mn{border:1.5px solid var(--ink);background:var(--card);margin:8px 0}
.mn summary{list-style:none;cursor:pointer;padding:12px 14px;font-family:"Noto Serif JP",serif;font-weight:900;font-size:16px;display:flex;align-items:center;gap:10px;min-height:44px}
.mn summary::-webkit-details-marker{display:none}
.mn summary:after{content:"＋";margin-left:auto;color:var(--sub);font-weight:700}
.mn[open] summary:after{content:"－"}
.mn-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--shu);color:var(--on-shu);display:inline-flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:-.08em}
.mn-b{padding:0 14px 12px;border-top:1px solid var(--hair);font-size:15px;line-height:1.75}
.mn-b p{margin:10px 0 0}
.mn-b ul{margin:8px 0 0;padding-left:1.2em}
.mn-b li{margin:4px 0}

/* 押せるもの＝影がある／記録＝枠なし（2026-10-14 見分けやすく） */
.btn{box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 45%,var(--paper))}
.btn.sub,.fuda button,.tebiki,.nav{box-shadow:0 3px 0 var(--ink)}
.btn.ok{box-shadow:0 4px 0 color-mix(in srgb,var(--shu) 60%,#000)}
.btn.mini{box-shadow:0 2px 0 var(--ink)}
.btn:active,.fuda button:active,.nav:active,.tebiki:active,.go:active{transform:translateY(3px);box-shadow:none}
.btn:disabled,.nav:disabled{box-shadow:none}
.fuda{padding-bottom:3px}
.kpis{gap:0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.kpi{border:0;background:transparent;padding:10px 8px}
.kpi+.kpi{border-top:1px dotted var(--hair)}
.kpis .kpi:nth-child(2){border-top:0;border-left:1px dotted var(--hair)}
.kpi.wide .foot{margin-top:4px;font-size:13px}
.sec-s{letter-spacing:.05em;color:var(--sub);margin-left:-4px}
/* 今日の稽古（いちばん上の赤いボタン） */
.go{display:block;width:100%;margin:16px 0 0;border:0;border-radius:12px;background:var(--shu);color:var(--on-shu);padding:20px 12px 14px;cursor:pointer;
  box-shadow:0 5px 0 color-mix(in srgb,var(--shu) 60%,#000),0 8px 18px rgba(0,0,0,.16);font-family:"Noto Serif JP",serif;text-align:center}
.go-t{display:block;font-size:24px;font-weight:900;letter-spacing:.06em;line-height:1.3}
.go-ar{font-size:20px;margin-right:6px}
.go small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:14px;font-weight:700;margin-top:6px;opacity:.95}
.go-hint{text-align:center;font-size:14px;font-weight:700;margin:14px 0 2px}
.setline{text-align:center;color:var(--sub);font-size:14px}
.link{background:none;border:0;padding:10px 6px;min-height:44px;color:var(--ink);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.shu{color:var(--shu)}
/* ほかの稽古 */
.navs{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px;padding-bottom:3px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:10px;padding:12px 10px 12px 14px;min-height:64px;cursor:pointer;font:inherit}
.nav b{display:block;font-family:"Noto Serif JP",serif;font-weight:900;font-size:17px;letter-spacing:.08em}
.nav small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.nav i{font-style:normal;font-size:22px;color:var(--sub)}
.nav:disabled{opacity:.45;cursor:default}
/* 区切りの目盛り */
.ck{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);margin-top:6px;font-weight:700}
.ck span{margin-right:4px}
.ck i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.ck i.on{background:var(--shu);border-color:var(--shu)}
.ck b{margin-left:6px;color:var(--ink)}
/* 段のシート：区切りを選ぶ */
.sh-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--hair);padding-bottom:8px}
.sh-h b{font-family:"Noto Serif JP",serif;font-weight:900;font-size:22px;letter-spacing:.08em}
.sh-h span{font-size:13px;color:var(--sub)}
.grps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px;padding-bottom:3px}
.grps button{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 4px;min-height:60px;cursor:pointer;font:inherit;box-shadow:0 3px 0 var(--ink)}
.grps button b{display:block;font-family:"Noto Serif JP",serif;font-weight:900;font-size:16px}
.grps button small{font-size:12px;color:var(--sub)}
.grps button.clr{background:var(--ink);color:var(--on-ink)}
.grps button.clr small{color:var(--on-ink);opacity:.8}
.grps button:active{transform:translateY(3px);box-shadow:none}
.sheet-in{max-height:88dvh;overflow-y:auto}
/* お試しの吹き出し */
.coach{display:flex;gap:10px;align-items:flex-start;background:var(--shu-bg);border-left:4px solid var(--shu);padding:10px 12px;margin:12px 0 4px;font-size:15px;line-height:1.6}
.coach .cn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--shu);color:var(--on-shu);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}

/* 書きの答え：1字ずつの枠と拡大 */
.chars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:6px 0 4px;flex-wrap:wrap}
.chars .ch{width:76px;height:76px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font-family:"Noto Serif JP",serif;font-weight:900;font-size:52px;line-height:1;cursor:zoom-in;padding:0;
  background-image:linear-gradient(var(--hair),var(--hair)),linear-gradient(var(--hair),var(--hair));background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat}
.chars .kana{font-family:"Noto Serif JP",serif;font-weight:900;font-size:40px;padding-bottom:6px}
.zoom{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.zoom span{font-family:"Noto Serif JP",serif;font-weight:900;font-size:min(72vw,300px);line-height:1;color:var(--ink);border:2px solid var(--ink);padding:10px;
  background-image:linear-gradient(var(--hair),var(--hair)),linear-gradient(var(--hair),var(--hair));background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat}
.zoom small{color:var(--sub)}
.self{text-align:center;font-weight:700;margin-top:14px}
.crit{font-size:13px;color:var(--sub);text-align:center;margin:4px 0 2px;line-height:1.6}
.btn.ok:before{content:"";display:inline-block;width:.75em;height:.75em;border:3px solid currentColor;border-radius:50%;margin-right:.4em;vertical-align:-.05em}
.sym{-webkit-text-stroke:1.5px currentColor;margin-right:.35em}
/* 結果の達成度 */
.delta{display:grid;grid-template-columns:auto auto;justify-content:center;gap:2px 16px;text-align:left;margin-top:12px;padding-top:10px;border-top:1px solid var(--hair);font-variant-numeric:tabular-nums}
/* やった日 */
.kpi.days{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kpi.days .big{font-size:34px}
.marks{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:60%}
.dm{width:26px;height:26px;border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;font-size:15px;color:var(--ink)}
.dm.on{color:var(--ink)}
.dm.full{background:var(--ink);color:var(--on-ink)}
/* 紙で解く */
.paper{margin:10px 0 0;padding:0;list-style:none}
.pn{flex:none;min-width:1.8em;text-align:right;font-family:"Noto Serif JP",serif;font-weight:900;font-size:18px}
.paper li{padding:8px 0;border-bottom:1px solid var(--hair);display:flex;align-items:baseline;gap:10px}
.pk{flex:none;font-size:12px;border:1px solid var(--sub);color:var(--sub);padding:0 5px}
.pq{font-family:"Noto Serif JP",serif;font-weight:700;font-size:20px}
.pq u{text-decoration:none;border-bottom:2px solid var(--shu)}
.top h1{margin:0}
</style>

/* 漢数字（0〜99）：ステージ名・本番までの日数に使う */
function kn(n){
  const d = '〇一二三四五六七八九';
  if(n < 10) return d[n];
  const t = Math.floor(n / 10), o = n % 10;
  return (t > 1 ? d[t] : '') + '十' + (o ? d[o] : '');
}
/* 段：20語ずつ（最後の段に端数）。どの段も書きと読みを同じ割合で混ぜる（本番の20問に近い形）。
   書き・読みはそれぞれ用紙の順 */
function makeStages(){
  const K = QUESTIONS.map((q, i) => q.t === 'k' ? i : -1).filter(i => i >= 0);
  const Y = QUESTIONS.map((q, i) => q.t === 'y' ? i : -1).filter(i => i >= 0);
  const all = K.length + Y.length, n = Math.max(1, Math.floor(all / STAGE_SIZE)), out = [];
  const T = k => k >= n ? all : k * STAGE_SIZE;               // k段目までの語数
  const Kc = k => Math.round(T(k) * K.length / all);          // そのうちの書きの数
  for(let k = 0; k < n; k++){
    const ix = [...K.slice(Kc(k), Kc(k + 1)), ...Y.slice(T(k) - Kc(k), T(k + 1) - Kc(k + 1))];
    out.push({id: 'd' + (k + 1), name: kn(k + 1) + 'の段', label: kn(k + 1) + 'の段', ix});
  }
  return out;
}

const sIx = x => x.ix.filter(i => S.only === 'all' || QUESTIONS[i].t === S.only);

function groupsOf(x){
  const ix = sIx(x), n = Math.max(1, Math.round(ix.length / 5)), out = [];

/* 覚えた＝別の日に2回つづけて正解／あと少し＝正解は1日分だけ／苦手＝直近が不正解 */
function level(i){

/* 達成度：範囲の語のうち、1回でも正解したことのある語の割合（％）。書き・読み別。下がらない */
function ofType(t){ return QUESTIONS.map((q, i) => q.t === t ? i : -1).filter(i => i >= 0); }
function achieved(t){ return ofType(t).filter(i => S.items[i] && S.items[i].ok > 0).length; }

function mastered(t){ return (t ? ofType(t) : QUESTIONS.map((_, i) => i)).filter(i => S.items[i] && S.items[i].everM).length; }
function masteredPct(t){ const n = ofType(t).length; return n ? Math.floor(mastered(t) / n * 100) : 0; }

function isWrong(i){ const s = S.items[i]; if(!s || !s.seen) return false; return s.wrong !== undefined ? s.wrong : s.streak === 0; }

function record(i, ok){
  const s = st(i), t = today();
  s.seen++; s.last = Date.now();
  // 「覚えた」は別の日に2回つづけて正解したとき。同じ日に何度正解しても1日分しか進めない
  if(ok){ s.ok++; if(s.sDay !== t){ s.streak++; s.sDay = t; } if(s.streak >= 2) s.everM = true; }
  else { s.streak = 0; s.sDay = null; }
  if(s.wrDay !== t){ s.wr = 0; s.wrDay = t; }   // 今日の連続まちがい

  else if(!ok) s.wrong = true;

}

/* ---------- 文字の扱い ---------- */
function norm(x){
  return String(x).normalize('NFKC')
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s。、．，.,・]/g, '');
}
function esc(x){ return String(x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sentence(q){ return esc(q).replace(/［(.+?)］/g, '<u>$1</u>'); }
function solo(q){ return /^［[^］]+］[ぁ-ゖ]*$/.test(q) ? ' solo' : ''; }
function word(item){ return item.t === 'y' ? item.q.replace(/［|］/g, '') : (item.w || item.a); }
/* 読みがな（図鑑用）：書きはカタカナの問題をひらがなに、読みは答え */
function reading(item){
  if(item.t === 'y') return item.a.join('／');
  return item.q.replace(/［|］/g, '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
function mockQ(item){
  const e = item.e;
  if(!e) return item.q;
  if(item.t === 'y'){ const w = word(item); return e.includes(w) ? e.replace(w, '［' + w + '］') : item.q; }
  const w = item.w || item.a;
  if(e.includes(w)) return e.replace(w, item.q);                        // 例：但し → ［タダ］し
  const kana = (item.q.match(/［(.+?)］/) || [])[1];
  if(kana && e.includes(item.a)) return e.replace(item.a, '［' + kana + '］');   // 例：据えた → ［ス］えた
  return item.q;
}
/* 出題文：模試は文の中で、練習は語だけ */
const qOf = item => R && R.mode === 'mock' ? mockQ(item) : item.q;
function filled(item){   // 書きの答えを入れた文（カタカナ部分を漢字に置き換え）
  if(item.t !== 'k') return item.q.replace(/［|］/g,'');
  return item.q.replace(/［.+?］/, item.a);
}
function extra(item){
  if(!item.m && !item.e) return '';
  let ex = item.e ? esc(item.e) : '';
  for(const k of [word(item), item.a].filter(x => typeof x === 'string')){
    if(item.e && item.e.includes(k)){ ex = esc(item.e).replace(esc(k), '<mark>' + esc(k) + '</mark>'); break; }
  }
  return `<div class="ex">${item.m ? `<div><b>意味</b><span>${esc(item.m)}</span></div>` : ''}${ex ? `<div><b>例文</b><span>${ex}</span></div>` : ''}</div>`;
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- 出題の並び ---------- */
function myIdx(){ return QUESTIONS.map((q, i) => (S.only === 'all' || q.t === S.only) ? i : -1).filter(i => i >= 0); }
const byOld = (a, b) => String((S.items[a] || {}).lastDay || '').localeCompare(String((S.items[b] || {}).lastDay || ''));

function checkPool(){
  const t = today();
  const pool = myIdx().filter(i => { const s = S.items[i]; return s && s.seen && s.lastDay && s.lastDay < t && level(i) < 2 && !out(i); });
  const g0 = pool.filter(i => level(i) === 0).sort(byOld), g1 = pool.filter(i => level(i) === 1).sort(byOld);
  return revengeFirst([...g0, ...g1]);
}
function checkLimit(){ return Math.max(2, Math.min(CHECK_MAX, Math.round(S.min * 60 / 3 / 15))); }
/* 総ざらい：これまでに正解したことのある語ぜんぶ（覚えた語も）。苦手→古い順 */
function sweepPool(){
  const pool = myIdx().filter(i => S.items[i] && S.items[i].ok > 0 && !out(i));
  return revengeFirst([...pool.filter(i => level(i) < 2).sort(byOld), ...pool.filter(i => level(i) === 2).sort(byOld)]);

/* 復習の稽古：苦手 → まだ出ていない → あと少し → 覚えた（それぞれの中はシャッフル） */
function trainQueue(){

  myIdx().forEach(i => { if(!out(i)) g[level(i)].push(i); });
  return revengeFirst([...shuffle(g[0]), ...shuffle(g[-1]), ...shuffle(g[1]), ...shuffle(g[2])]);

/* ステージ：まだ正解していない語をシャッフル */
function stageQueue(id){

  return revengeFirst(shuffle(pool.filter(i => !g.done.includes(i) && !out(i))));

/* いまの区切りの語 */
function ckWords(){ const c = R.ck; return groupsOf(stageById(c.stage)).slice(c.from, c.from + c.n).flat(); }
/* 区切りを始める：まだ正解していない語が残る最初の区切りから（選んだ区切りがあればそこ） */
function newChunk(stageId, group){
  const gs = groupsOf(stageById(stageId)), done = sg(stageId).done;
  const open = k => gs[k].some(i => !done.includes(i) && !out(i));
  const from = group != null ? group : Math.max(0, gs.findIndex((_, k) => open(k)));

/* 乱取り：一周するまで「まだ出ていない語」を持ち越す（ぜんぶ／書き／読みで別々） */
function rndAll(){ return myIdx().filter(i => !isLater(i)); }

function rndState(){

function mockQueue(){

function refill(){
  if(R.kind === 'random') return randomQueue();
  if(R.kind === 'sweep'){ const weak = sweepPool().filter(i => level(i) < 2); return weak.length ? weak : sweepPool(); }
  const more = trainQueue().filter(i => level(i) < 2);
  return more.length ? more : trainQueue();
}
/* 回の中身を切り替える：check／stage／review／random／sweep */
function setKind(kind, stageId, group){
  R.kind = kind; R.stage = kind === 'stage' ? stageId : null;
  if(kind === 'stage' && !(R.ck && R.ck.stage === stageId)) R.ck = newChunk(stageId, group);   // 区切りを始める
  if(kind !== 'stage') R.ck = null;
  const q = kind === 'check' ? R.check.ix.slice()
          : kind === 'stage' ? stageQueue(stageId)
          : kind === 'random' ? randomQueue()
          : kind === 'wrong' ? R.wset.ix.slice()
          : kind === 'redo' ? shuffle(R.gset.ix.filter(i => !out(i)))
          : kind === 'sweep' ? sweepPool()
          : trainQueue();
  R.queue = q.map(i => ({i, revive:false})); R.pos = 0;
  if(kind === 'sweep') R.sweepN = q.length;
}

  const pool = S.checkDays.includes(today()) ? [] : checkPool();
  const after = nx ? `${nx.label}（${S.chunk}語ずつ）` : '復習の稽古';
  if(pool.length) return {kind:'check', n:Math.min(pool.length, checkLimit()), label:'きのうの確認から', sub:`きのうの確認${Math.min(pool.length, checkLimit())}語 → ${after}`};
  if(nx) return {kind:'stage', stage:nx.id, label:`${nx.label}をはじめる`, sub:`${nx.label}から　${S.chunk}語ずつ`};
  return {kind:'review', label:'復習の稽古', sub:'復習の稽古：苦手な字から出る'};
}

function stageSheet(id){
  document.querySelectorAll('.sheet').forEach(x => x.remove());
  const x = stageById(id), g = sg(id), gs = groupsOf(x), open = stageOpen(x);
  const box = document.createElement('div'); box.className = 'sheet';
  box.innerHTML = `<div class="sheet-in card">
      <div class="sh-h"><b>${esc(x.label)}</b><span>${g.cleared ? '達成' : `${sDone(x)} / ${sIx(x).length}語 正解ずみ`}${g.perfect ? '・朱印「完」' : ''}</span></div>
      ${open && !g.cleared ? `<button class="btn" id="cont">${esc(x.label)}を続ける<small>区切りは${S.chunk}語ずつ（ノーミスで大きくなる）</small></button>` : ''}
      ${open ? `<button class="btn sub" id="whole">${sIx(x).length}語まとめて<small>区切らずに、段をぜんぶ一気に</small></button>` : ''}
      <div class="cap" style="margin-top:12px">区切りを選ぶ（${gs.length > 1 ? '5語ずつ' : 'この段は1つ'}）</div>
      <div class="grps">${gs.map((w, k) => { const d = w.filter(i => g.done.includes(i)).length, all = d >= w.length;
        return `<button data-g="${k}" class="${all ? 'clr' : ''}"><b>区切り${kn(k + 1)}</b><small>${all ? '済・もう一度' : `${d}/${w.length}`}</small></button>`; }).join('')}</div>
      <div class="note" style="text-align:left">済の区切りは、その5語だけをもう一度できる（段の進み具合は変わらない）</div>
      ${g.cleared || g.done.length ? `<button class="btn sub" id="reset">${esc(x.label)}を0からやり直す<small>${g.cleared ? '達成と朱印の記録は残る' : '正解ずみを消して最初から'}</small></button>` : ''}
      <button class="btn sub" id="sclose">やめる</button></div>`;
  document.body.appendChild(box);
  const go = plan => { box.remove(); startTrain(plan); };
  box.onclick = e => { if(e.target === box) box.remove(); };
  if(box.querySelector('#cont')) box.querySelector('#cont').onclick = () => go({kind:'stage', stage:id});
  if(box.querySelector('#whole')) box.querySelector('#whole').onclick = () => go({kind:'stage', stage:id, whole:true});
  box.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const k = +b.dataset.g, w = gs[k];
    if(w.some(i => !g.done.includes(i) && !out(i))) return go({kind:'stage', stage:id, group:k});
    const ix = w.filter(i => !out(i));
    if(ix.length) go({kind:'redo', ix, label:`${x.label}・区切り${kn(k + 1)}`, stage:id});
  });
  if(box.querySelector('#reset')) box.querySelector('#reset').onclick = () => { g.done = []; g.miss = 0; save(); go({kind:'stage', stage:id}); };
  box.querySelector('#sclose').onclick = () => box.remove();
}

}

  const set = d => { g = clampGoal(g + d); document.getElementById('gv').textContent = g + '点'; };
  document.getElementById('gm').onclick = () => set(-TEST.goalStep);
  document.getElementById('gp').onclick = () => set(TEST.goalStep);
  if(showDays){
    const setD = d => { dg = Math.min(maxDays(), Math.max(Math.max(1, doneDays().length), dg + d)); document.getElementById('dv').textContent = dg + '日'; };
    document.getElementById('dm').onclick = () => setD(-1);
    document.getElementById('dp').onclick = () => setD(1);
  }
  document.getElementById('ok').onclick = () => { S.goal = g; if(showDays && (dg !== dg0 || S.dayGoal == null)) S.dayGoal = dg; save(); if(first && !S.trialDone) trial(0); else home(); };
  if(!first) document.getElementById('back').onclick = home;
}

/* お試し2問（最初に1回だけ・手引きからもう一度）：書き1問・読み1問を、吹き出しの説明つきで。記録には残さない */
function trial(step){
  stopTimer(); clearFx(); window.scrollTo(0, 0);
  const first = STAGES[0].ix, ik = first.find(i => QUESTIONS[i].t === 'k'), iy = first.find(i => QUESTIONS[i].t === 'y');

  const done = () => { S.trialDone = true; save(); };

  if(step === 0){

        ${coach('1', '線のカタカナを、<b>頭の中で漢字に</b>書いてみる（指や紙に書いてもOK）')}

    bindSkip();
    document.getElementById('open').onclick = () => {
      app.querySelector('.card').innerHTML = `
        <div class="q${solo(item.q)}">${sentence(item.q)}</div>
        ${chars(item)}
        ${coach('3', `頭の中の字と1字ずつ見くらべる。<b>同じなら「正解」</b>、ちがう・迷ったら<b>「不正解」</b>を自分で押す`)}
        <div class="row">
          <button class="btn ok" id="y">正解</button>
          <button class="btn ng" id="n"><span class="sym">×</span>不正解</button>
        </div>`;
      bindZoom();
      document.getElementById('y').onclick = () => trial(1);
      document.getElementById('n').onclick = () => trial(1);
    };
    return;
  }
  if(step === 1){
    const item = QUESTIONS[iy];
    app.innerHTML = `${top(2)}
      <div class="card">
        <div class="ask">読みの問題</div>
        <div class="q${solo(item.q)}">${sentence(item.q)}</div>
        ${coach('1', '線の部分の読みを<b>ひらがなで</b>入れて「こたえる」。わからなければ「わからない」')}
        <form id="f" autocomplete="off">
          <input class="ans" id="in" inputmode="text" lang="ja" enterkeyhint="done" placeholder="ひらがなで入力">
          <button class="btn" type="submit">こたえる</button>
        </form>
        <button class="btn sub" id="pass">わからない</button>
      </div>`;
    bindSkip();
    const fin = typed => {
      const ok = !!typed && item.a.some(a => norm(a) === norm(typed));
      app.querySelector('.card').innerHTML = `
        <div class="q${solo(item.q)}">${sentence(item.q)}</div>
        <div class="judge ${ok ? 'ok' : 'ng'}">${ok ? '正解' : '答えは'}</div>
        <div class="answer" style="font-size:36px">${item.a.map(esc).join('<span class="muted"> ／ </span>')}</div>
        ${coach('2', '読みはアプリが自動で○×をつける。本番の稽古では、間違えた語は3問あとにもう一度出る')}

      document.getElementById('nx').onclick = () => trial(2);
    };
    document.getElementById('f').onsubmit = e => { e.preventDefault(); const v = document.getElementById('in').value; if(norm(v)) fin(v); };
    document.getElementById('pass').onclick = () => fin('');

    </div>

    <button class="btn sub" id="top">トップを見る</button>`;

let R = null;   // 実行中の回
function newRun(mode){
  return {mode, kind:null, stage:null, clears:[], queue:[], pos:0, right:0, total:0, combo:0, maxCombo:0,
    before: achievedBoth(), mBefore: {k: mastered('k'), y: mastered('y')}, minutes: S.min,
    end: Date.now() + S.min * 60000, timeUp:false, skipped:0, check:null, after:null};
}
/* 練習を始める：plan.kind＝check（きのうの確認のあと段へ）／stage／review／random／sweep */
function startTrain(plan){
  R = newRun('train');
  R.fixed = plan.group != null;   // 区切りを選んで始めた：区切りは1つずつ（大きさは変えない）
  R.whole = !!plan.whole;         // 段の20語をまとめて：区切りなし（大きさは変えない）
  if(plan.kind === 'redo') R.gset = {ix: plan.ix.slice(), done:new Set(), first:new Set(), missed:new Set(), label: plan.label, stage: plan.stage};
  if(plan.kind === 'wrong'){
    const ix = wrongQueue();
    if(!ix.length){ R = null; return home(); }
    R.wset = {ix, done:new Set(), before: wrongIdx().length};
  }
  if(plan.kind === 'check'){
    const pool = checkPool();
    if(pool.length){
      const nx = nextStage();
      R.check = {ix: pool.slice(0, plan.n || checkLimit()), done:new Set(), missed:new Set(), short: !!plan.short};
      R.after = sweepDay() && sweepPool().length ? {kind:'sweep'} : nx ? {kind:'stage', stage:nx.id} : {kind:'review'};
      setKind('check');
    }else{ const p = goPlan(); setKind(p.kind === 'check' ? 'review' : p.kind, p.stage); }
  }else setKind(plan.kind, plan.stage, plan.group);
  startTimer();
  show();
}
function clock(){
  const sec = Math.max(0, Math.ceil((R.end - Date.now()) / 1000));
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
function tick(){
  if(!R) return stopTimer();
  const sec = Math.max(0, Math.ceil((R.end - Date.now()) / 1000));
  const t = document.getElementById('timer');
  if(t){ t.textContent = clock(); t.classList.toggle('low', sec <= 10); }
  if(sec === 0 && !R.timeUp){ R.timeUp = true; stopTimer(); const f = R.onTimeUp; R.onTimeUp = null; if(f) f(); }
}
function bar(label, d, n){
  return `<div class="sbar"><span>${label}</span><div><i style="width:${n ? d / n * 100 : 0}%"></i></div><span>${d}/${n}</span></div>`;
}
function stageBar(){ const x = stageById(R.stage); return bar(esc(x.label), sDone(x), sIx(x).length); }
/* 区切りの目盛り（●＝正解ずみ）。20語の区切りは数字だけ */
function ckName(c){ const all = groupsOf(stageById(c.stage)).length, to = Math.min(all, c.from + c.n);
  return all === 1 ? '' : to - c.from === 1 ? '区切り' + kn(c.from + 1) : to - c.from >= all ? '' : '区切り' + kn(c.from + 1) + '〜' + kn(to); }
function chunkBar(){
  if(!R.ck || R.kind !== 'stage') return '';
  const w = ckWords().filter(i => !isLater(i)), d = w.filter(i => sg(R.stage).done.includes(i)).length, nm = ckName(R.ck);
  if(!nm || w.length <= 1) return '';
  return `<div class="ck"><span>${nm}</span>${w.length <= 10 ? w.map((_, k) => `<i class="${k < d ? 'on' : ''}"></i>`).join('') : ''}<b>${d}/${w.length}</b></div>`;
}
function kindBar(){
  if(R.mode === 'mock') return '';
  if(R.kind === 'check') return bar('きのうの確認', R.check.done.size, R.check.ix.length);
  if(R.kind === 'stage') return stageBar() + chunkBar();
  if(R.kind === 'sweep') return `<div class="sbar"><span>総ざらい（${R.sweepN}語）</span></div>`;
  if(R.kind === 'wrong') return bar('間違えた語', R.wset.done.size, R.wset.ix.length);
  if(R.kind === 'random'){ const n = rndN(), left = rndLeft().length, r = rndState().r;
    return `<div class="sbar"><span>乱取り・${randName()}${r > 1 ? `・${kn(r)}周目` : ''}</span><div><i style="width:${n ? (n - left) / n * 100 : 0}%"></i></div><span>残り${left}語</span></div>`; }
  if(R.kind === 'redo') return bar(esc(R.gset.label) + '・もう一度', R.gset.done.size, R.gset.ix.length);
  return '<div class="sbar"><span>復習の稽古</span></div>';
}
function header(cur){
  const left = R.mode === 'mock'
    ? `<span class="timer" id="timer">${clock()}</span><span class="muted">${R.pos + 1} / ${R.queue.length}</span>`
    : `<span class="timer" id="timer">${clock()}</span>`;
  const kind = cur.revive ? '<span class="kind revive">復活戦</span>'
             : revenge(cur.i) && R.mode === 'train' ? '<span class="kind revive">リベンジ</span>'
             : `<span class="kind">${QUESTIONS[cur.i].t === 'y' ? '読み' : '書き'}</span>`;
  return `<div class="top">${left}${kind}<button class="btn sub mini" id="quit">やめる</button></div>
          ${kindBar()}
          <div class="combo" id="combo">${R.combo >= 2 ? R.combo + '連続正解' : ''}</div>`;
}
function show(){
  clearFx();
  if(R.mode === 'mock' && R.timeUp) return result();
  if(R.mode === 'train' && R.timeUp) return askExtend();
  if(R.mode === 'train') while(R.pos < R.queue.length && out(R.queue[R.pos].i)) R.pos++;
  if(R.mode === 'train' && R.pos >= R.queue.length){
    if(R.kind === 'check') return checkDone();
    if(R.kind === 'wrong') return wrongDone();
    if(R.kind === 'stage'){ setKind('stage', R.stage); if(!R.queue.length) return stageRest(); }
    else if(R.kind === 'redo'){ const rest = R.gset.ix.filter(i => !R.gset.done.has(i) && !out(i)); if(!rest.length) return redoDone(); R.queue.push(...shuffle(rest).map(i => ({i, revive:false}))); }
    else if(R.kind === 'random' && !randomQueue().length) return result();
    else { R.queue.push(...refill().map(i => ({i, revive:false}))); }
  }
  if(R.pos >= R.queue.length) return result();
  const cur = R.queue[R.pos], item = QUESTIONS[cur.i], mock = R.mode === 'mock';
  if(item.t === 'y'){
    app.innerHTML = `${header(cur)}
      <div class="card">
        <div class="ask">線の部分の読みを、ひらがなで</div>
        <div class="q${solo(qOf(item))}">${sentence(qOf(item))}</div>
        <form id="f" autocomplete="off">
          <input class="ans" id="in" inputmode="text" lang="ja" enterkeyhint="done" placeholder="ひらがなで入力">
          <button class="btn" type="submit">こたえる</button>
        </form>
        <button class="btn sub" id="pass">わからない</button>
      </div>`;
    const inp = document.getElementById('in');
    inp.focus();
    inp.addEventListener('keydown', e => { if(e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault(); });
    document.getElementById('f').onsubmit = e => {
      e.preventDefault();
      const v = norm(inp.value); if(!v) return;
      answered(item.a.some(a => norm(a) === v), inp.value);
    };
    document.getElementById('pass').onclick = () => answered(false, '');
  }else{
    app.innerHTML = `${header(cur)}
      <div class="card">
        <div class="ask">線のカタカナを漢字に。<br>頭の中で（書ける場所なら指や紙に）書いてから、答えを見よう</div>
        <div class="q${solo(qOf(item))}">${sentence(qOf(item))}</div>
        ${item.m && !mock ? `<div class="mean"><b>意味</b><span>${esc(item.m)}</span></div>` : ''}
        <button class="btn" id="open">答えを見る</button>
      </div>`;
    document.getElementById('open').onclick = () => {
      app.querySelector('.card').innerHTML = `
        <div class="q${solo(qOf(item))}">${sentence(qOf(item))}</div>
        ${chars(item)}
        ${item.w ? '' : `<div class="full">${esc(filled(item))}</div>`}
        ${extra(item)}
        <div class="self">頭の中で書いた字と、ぴったり同じだった？</div>
        <div class="crit">${CRIT}${mock ? '（間違えた語は明日の確認に出る）' : '（3問あとにもう一度出るから得）'}</div>
        <div class="row">
          <button class="btn ok" id="y">正解</button>
          <button class="btn ng" id="n"><span class="sym">×</span>不正解</button>
        </div>`;
      bindZoom();
      document.getElementById('y').onclick = () => next(true);
      document.getElementById('n').onclick = () => next(false);
    };
  }
  document.getElementById('quit').onclick = () => { if(R.total === 0) return home(); result(true); };
  tick();
}
function answered(ok, typed){
  const item = QUESTIONS[R.queue[R.pos].i];
  const card = app.querySelector('.card');
  card.innerHTML = `
    <div class="q${solo(qOf(item))}">${sentence(qOf(item))}</div>
    <div class="judge ${ok ? 'ok' : 'ng'}">${ok ? '正解' : (typed ? `「${esc(typed)}」ではなく` : '答えは')}</div>
    ${ok ? `<div class="full">${item.a.map(esc).join(' ／ ')}</div>` : `<div class="answer" style="font-size:36px">${item.a.map(esc).join('<span class="muted"> ／ </span>')}</div>`}
    ${!ok && R.mode === 'train' ? '<div class="muted center">だいじょうぶ。この語は3問あとに「復活戦」でもう一度出る</div>' : ''}
    ${extra(item)}
    <button class="btn" id="nx">つぎへ</button>`;
  const b = document.getElementById('nx'); b.focus();
  b.onclick = () => next(ok, true);
  bump(ok);
}
function bump(ok){
  const c = document.getElementById('combo');
  const n = ok ? R.combo + 1 : 0;
  if(c){ c.textContent = n >= 2 ? n + '連続正解' : ''; if(n >= 2){ c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); } }
  if(ok && navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
}
function next(ok, alreadyBumped){
  const cur = R.queue[R.pos];
  record(cur.i, ok);
  R.total++;
  if(ok){ R.right++; R.combo++; R.maxCombo = Math.max(R.maxCombo, R.combo); } else R.combo = 0;
  if(!alreadyBumped) bump(ok);
  if(!ok && R.mode === 'train'){
    R.queue.splice(Math.min(R.pos + 1 + REVIVE_GAP, R.queue.length), 0, {i:cur.i, revive:true});
    if(st(cur.i).wr >= SKIP_AFTER) return askSkip(cur.i, ok);
  }
  afterAnswer(cur, ok);
}
/* 同じ語を今日5回つづけて間違えた：「次は行ける」か「今日はスキップ（明日覚える）」を選ぶ */
function askSkip(i, ok){
  const q = QUESTIONS[i];
  app.innerHTML = `<h1>手ごわい語に当たった</h1>
    <div class="muted">今日${SKIP_AFTER}回つづけて×</div>
    <div class="card center">
      <div class="big">${esc(word(q))}</div>
      ${q.t === 'y' ? `<div class="full">${q.a.map(esc).join(' ／ ')}</div>` : ''}
      ${extra(q)}
      <div style="margin-top:8px">この語、どうする？</div>
    </div>
    <button class="btn" id="go2">次は行ける！<small>3問あとにもう一度出る</small></button>
    <button class="btn sub" id="skip">今日はスキップ<small>明日覚える（明日いちばん先に出る）</small></button>
    <button class="btn sub" id="later">あとまわし<small>ほかをぜんぶ覚えたら戻すか聞く（模試とめくり札には出る）</small></button>`;
  document.getElementById('go2').onclick = () => { st(i).wr = 0; save(); afterAnswer(R.queue[R.pos], ok); };
  document.getElementById('later').onclick = () => {
    S.later[i] = today(); save();
    R.queue = R.queue.filter((e, k) => k <= R.pos || e.i !== i);   // この先の出番を消す
    R.latered = (R.latered || 0) + 1;
    afterAnswer(R.queue[R.pos], ok);
  };
  document.getElementById('skip').onclick = () => {
    S.skip[i] = today(); save();
    R.queue = R.queue.filter((e, k) => k <= R.pos || e.i !== i);   // この先の出番を消す
    R.skipped++;
    afterAnswer(R.queue[R.pos], ok);
  };
}
function afterAnswer(cur, ok){
  R.pos++;
  if(R.mode === 'train' && R.kind === 'check'){
    if(ok) R.check.done.add(cur.i); else R.check.missed.add(cur.i);
    if(R.check.ix.every(i => R.check.done.has(i) || out(i))) return checkDone();
  }
  if(R.mode === 'train' && R.kind === 'wrong'){
    if(ok) R.wset.done.add(cur.i);
    if(R.wset.ix.every(i => R.wset.done.has(i) || out(i))) return wrongDone();
  }
  if(R.mode === 'train' && R.kind === 'stage'){
    const g = sg(R.stage), x = stageById(R.stage);
    if(ok){ if(!g.done.includes(cur.i)){ g.done.push(cur.i); if(R.ck) R.ck.got++; } } else { g.miss++; if(R.ck) R.ck.miss++; }
    save();
    if(g.done.length >= x.ix.length) return stageClear();
    const left = sIx(x).filter(i => !g.done.includes(i) && !out(i)).length;
    if(R.ck && left > 0 && ckWords().every(i => g.done.includes(i) || out(i))) return chunkDone();
  }
  if(R.mode === 'train' && R.kind === 'random' && !cur.revive){
    const st = rndState(); st.left = st.left.filter(i => i !== cur.i);
    if(!ok && !st.miss.includes(cur.i)) st.miss.push(cur.i);
    save();
    if(!st.left.length) return roundDone();
  }
  if(R.mode === 'train' && R.kind === 'redo'){
    const gs = R.gset;
    if(!gs.done.has(cur.i) && !gs.missed.has(cur.i) && ok) gs.first.add(cur.i);
    if(ok) gs.done.add(cur.i); else gs.missed.add(cur.i);
    if(gs.ix.every(i => gs.done.has(i) || out(i))) return redoDone();
  }
  show();
}
/* 一区切りの画面から続けるとき：止めていた残り時間から再開 */
function resume(left, kind, stageId){
  R.pausedAt = null;
  R.end = Date.now() + left; R.timeUp = left <= 0;
  setKind(kind, stageId);
  if(!R.timeUp) startTimer();
  show();
}
/* 間違えた語をひと通り正解した */
function wrongDone(){
  stopTimer(); R.pausedAt = Date.now();
  const before = R.wset.before, after = wrongIdx().length, left = Math.max(0, R.end - Date.now()), p = goPlan();
  app.innerHTML = `<h1>間違えた語、ひと通り正解</h1>
    <div class="card center">
      <div class="big">${before}<small>語</small> → ${after}<small>語</small></div>
      <div>${before - after > 0 ? `${before - after}語が外れた` : 'まだ外れた語はない'}</div>
      ${after ? '<div class="muted">今日はじめて答えたときに正解した語だけが外れる。<br>間違えてから正解した語は、明日の最初に正解すると外れる</div>' : '<div class="goal">間違えた語は 0語</div>'}
    </div>
    <button class="btn" id="nx">次へ：${esc(p.label)}${left > 0 ? `<small>残り ${clock()}</small>` : ''}</button>
    <button class="btn sub" id="fin">終わる</button>`;
  document.getElementById('nx').onclick = () => {
    R.pausedAt = null; R.end = Date.now() + left; R.timeUp = left <= 0;
    if(p.kind === 'check'){ const pool = checkPool(), nx = nextStage();
      R.check = {ix: pool.slice(0, checkLimit()), done:new Set(), missed:new Set()};
      R.after = sweepDay() && sweepPool().length ? {kind:'sweep'} : nx ? {kind:'stage', stage:nx.id} : {kind:'review'}; }
    setKind(p.kind, p.stage);
    if(!R.timeUp) startTimer();
    show();
  };
  document.getElementById('fin').onclick = () => result();
}
/* きのうの確認がおわった */
function checkDone(){
  stopTimer(); R.pausedAt = Date.now();
  const c = R.check, n = c.ix.length, first = c.ix.filter(i => c.done.has(i) && !c.missed.has(i)).length;
  if(!S.checkDays.includes(today())){ S.checkDays.push(today()); save(); }
  const left = Math.max(0, R.end - Date.now());
  const nxt = R.after.kind === 'stage' && sg(R.after.stage).cleared ? (nextStage() ? {kind:'stage', stage:nextStage().id} : {kind:'review'}) : R.after;
  const label = nxt.kind === 'stage' ? `次へ：${stageById(nxt.stage).label}` : nxt.kind === 'sweep' ? '次へ：総ざらい' : '次へ：復習の稽古';
  app.innerHTML = `<h1>きのうの確認おわり</h1>

/* 区切りの終わり：大きさを決め直す。ノーミス→1つ大きく／2問以上まちがえた→5語に戻す */
function closeChunk(){
  const c = R.ck; if(!c) return null;
  const words = ckWords().filter(i => !isLater(i)).length, nm = ckName(c); R.ck = null;
  if(!c.got) return null;
  if(R.fixed || R.whole) return {got:words, miss:c.miss, size:c.size, nm, msg: c.miss === 0 ? 'ノーミス！' : '区切りの語に、ぜんぶ正解'};
  const k = CHUNKS.indexOf(c.size);
  const size = c.miss === 0 ? CHUNKS[Math.min(k + 1, CHUNKS.length - 1)] : c.miss >= 2 ? CHUNKS[0] : c.size;
  S.chunk = size; save();
  const msg = size > c.size ? `ノーミス！次は${size}語に挑戦` : size < c.size ? `次は${size}語ずつにして、確実に` : c.miss === 0 ? 'ノーミス！この調子' : `次も${size}語ずつ`;
  return {got:words, miss:c.miss, size, nm, msg};
}
/* 区切りを抜けた：判子を押して、続けるか聞く（タイマーは止める） */
function chunkDone(){
  stopTimer(); R.pausedAt = Date.now();
  const c = closeChunk(), x = stageById(R.stage), left = Math.max(0, R.end - Date.now());
  const rest = sIx(x).filter(i => !sg(x.id).done.includes(i)).length, nc = newChunk(x.id), nn = ckName(nc);

      <p><b>トップの赤いボタン「今日の稽古をはじめる」を押すだけでいい。</b>何を出すかはアプリが決める。2日目からは、最初に「きのうの確認」（前の日までに出た語を最大10語）が出て、そのあと段の続きに進む。</p>
      <p>出す語（ぜんぶ／書きだけ／読みだけ）・時間（1〜30分）・目標は、赤いボタンの下の「変える」から。時間になったら「もう1・3・5分」か「終わる」を選ぶ。1日1分でも「やった日」になる。</p>
      <p>前の晩にまとめてやるより、毎日少しずつのほうが忘れにくい。2日目からは速くなる。</p>`, true)}
    ${sec(2, '「覚えた」になるのはいつ？', `
      <p><b>別の日に2回つづけて正解したとき。</b></p>
      <ul><li>1日目に正解 →「あと少し」</li><li>次の日以降にもう一度正解 →「覚えた」</li>
      <li>同じ日に何回正解しても1日分。あいだで1回でも間違えると数え直し</li></ul>
      <p>一度「覚えた」になった語は、トップの数（うち覚えた）から減らない。</p>`, true)}
    ${sec(3, '書きの採点のしかた', `
      <p>カタカナと意味を見て、頭の中で（書ける場所なら指や紙に）書く →「答えを見る」→ 自分で「正解／不正解」を押す。</p>
      <p><b>1字ずつ見て、とめ・はね・送りがなまで同じなら正解。1画でも迷ったら不正解。</b>不正解にしても3問あとにもう一度出るから損はない。字を押すと大きく見られる。</p>
      <p>記録は先生も見ない。甘く採点して損するのは自分だけ。</p>`)}
    ${sec(4, '読みの答え方', `<p>線の部分の読みを、ひらがなで入力して「こたえる」。カタカナで打っても正解になる。分からなければ「わからない」。</p>`)}
    ${sec(5, '段（ステージ）と朱印「完」', `
      <p>範囲を20語ずつに分けた「段」がある（${STAGES.length}段・最後の段だけ${STAGES[STAGES.length - 1].ix.length}語）。どの段も<b>書きと読みが混ざっている</b>（本番の20問に近い形）。「書きだけ」にすると、段の中の書きだけが出る。</p>
      <p>段の語にぜんぶ1回ずつ正解すると<b>達成</b>。1回も間違えずに達成すると朱印<b>「完」</b>。</p>
      <p><b>札を押すと、その段の区切り（5語ずつ）が開く。</b>「区切り一」などを選ぶと、その5語だけを練習できる（終わったら次の区切りへ）。<b>「20語まとめて」</b>なら区切らずに段をぜんぶ一気に。「済」の区切りは、その5語だけをもう一度できる。段を0からやり直すのもここから（達成の記録は残る）。</p>
      <p><b>区切り</b>：段の中は小さな区切りで進む。最初は<b>5語</b>。区切りをノーミスで抜けると次は<b>10語</b>、さらに抜けると段の<b>20語を一気に</b>。2問まちがえたら5語に戻る。区切りごとに「続ける／今日はここまで」を選べる。札から区切りを選んだときは、大きさは変わらず1区切りずつ進む。</p>`)}
    ${sec(6, '間違えたとき', `
      <ul><li><b>復活戦</b>：間違えた語は3問あとにもう一度出る</li>
      <li><b>5回つづけて×</b>：「次は行ける！」か「今日はスキップ（明日覚える）」を選べる。スキップした語は次の日に<b>リベンジ</b>としていちばん先に出る</li></ul>`)}
    ${sec(7, 'あとまわし（捨てる語）', `<p>どうしても覚えられない語は「あとまわし」にできる。5回つづけて×のときの画面か、図鑑で語を押して決める（図鑑から戻すこともできる）。</p>
      <ul><li>きのうの確認・段・乱取り・間違えた語・復習・総ざらいには出ない</li><li><b>本番模試とめくり札には出る</b>（本番に出るかもしれないのは変わらない）</li>
      <li>あとまわしが残っている段は<b>達成にならない</b></li><li>ほかの語がぜんぶ「覚えた」になったら、戻すか聞く</li></ul>`)}
    ${sec(8, '乱取り・間違えた語', `
      <p><b>乱取り</b>：選んでいる種類（ぜんぶ／書きだけ／読みだけ）の語をランダムに出す。<b>一周するまで、まだ出ていない語から出る</b>（次の回にも持ち越す）。トップと問題画面に「残り○語」。<b>一周したら、その周で間違えた語だけで次の周</b>（2周目・3周目…）。間違えが0の周で「乱取り完了」→ぜんぶの語で最初から。ぜんぶ・書きだけ・読みだけで別々に数える。</p>
      <p><b>間違えた語</b>：間違えた語だけを出す。<b>その日の最初の答えで正解すると外れる</b>（間違えてから正解しただけでは外れない。次の日の最初に正解すれば外れる）。</p>`)}
    ${sec(9, 'めくり札', `<p>採点しないで、めくって見るだけのカード。段ごとか、ぜんぶランダムで。カードを押すと答え、左右にスワイプか「次へ」でめくる。「いつも答えも出す」で両面を一度に見られる。電車の中や、友だちと出し合うときに。<b>記録には残らない</b>（「覚えた」にはならない）。</p>`)}
    ${sec(10, '本番模試', `
      <p>本番と同じ20問（書き${TEST.mockKaki}・読み${TEST.mockYomi}）を10分で。文の中の線の部分を答える（意味は出ない）。</p>
      <ul><li><b>紙で解く</b>：一覧を見てノートに書く → 答え合わせで1問ずつ正解／不正解</li>
      <li><b>スマホで解く</b>：1問ずつ答えて採点。0:00で終わり、解けなかった問題は0点</li></ul>
      <p>いちばんよかった点が「最高点」になる。間違えた語は次の日の確認に出る。</p>`)}
    ${sec(11, '本番の前日と当日', `<p>▶が<b>総ざらい</b>になる。これまでに正解した語を、苦手・古い順にぜんぶ出す。新しい段より、覚えた語を確かめるほうが点になる。前の晩はちゃんと寝る。</p>`)}
    ${sec(12, 'トップの数字の意味', `
      <ul><li><b>達成度</b>：1回でも正解したことのある語の割合（書き・読み別）。下がらない</li>
      <li><b>うち覚えた</b>：メーターの濃い帯。別の日に2回つづけて正解した語</li>
      <li><b>最高点</b>：本番模試のいちばんよかった点。赤い線が自分の目標</li>
      <li><b>やった日</b>：本番までに練習した日の数。休んでも0に戻らない。■は「きのうの確認」までやった日</li></ul>
      <p>トップの記録は<b>見るだけ</b>（押しても何も起きない）。押せるところには影と「›」がある。</p>
      <p><b>図鑑</b>の色：墨＝覚えた／金の枠＝あと少し／朱＝苦手（間違えた語）／白＝まだ。</p>`)}
    ${sec(13, '記録について', `
      <ul><li>記録はこのスマホの、このブラウザの中だけに残る。名前もログインもない。先生も見ない</li>
      <li>いつも同じ開き方で開く。<b>ホーム画面に追加</b>して、アイコンから開くのがおすすめ（LINEの中で開くと記録が別になることがある）</li>
      <li>目標点と「何日やるか」は、赤いボタンの下の「変える」→「目標を変える」でいつでも変えられる</li></ul>`)}
    <button class="btn sub" id="trial2">お試し2問をもう一度<small>書き1問・読み1問を説明つきで（記録には残らない）</small></button>
    <button class="btn" id="home">トップへ</button>`;
  document.getElementById('trial2').onclick = () => trial(0);
  document.getElementById('home').onclick = home;
  document.getElementById('home2').onclick = home;
}
function zukan(){
  clearFx();
  const tiles = QUESTIONS.map((q, i) => {
    const l = isWrong(i) ? 0 : level(i);
    return `<button class="tile s${l}${isLater(i) ? ' later' : ''}" data-z="${i}">${esc(word(q))}<span class="rd">${esc(reading(q))}</span><small>${q.t === 'y' ? '読み' : '書き'}${isLater(i) ? '・後回し' : skippedToday(i) ? '・明日' : revenge(i) ? '・リベンジ' : ''}</small></button>`;
  }).join('');
  app.innerHTML = `<div class="top"><h1>図鑑</h1><button class="btn sub mini" id="home2">トップへ</button></div>
    <div class="legend"><span><i style="background:var(--ink);border-color:var(--ink)"></i>覚えた</span><span><i style="border:1.5px solid var(--kin)"></i>あと少し</span>
      <span><i style="background:var(--shu-bg);border-color:var(--shu)"></i>苦手</span><span><i style="background:var(--card)"></i>まだ</span><span><i style="background:var(--card);border-style:dashed;border-color:var(--sub)"></i>あとまわし</span></div>
    <div class="note" style="text-align:left">語を押すと、あとまわしにしたり戻したりできる。</div>
    <div class="grid">${tiles}</div>
    <button class="btn" id="home">トップへ</button>`;
  document.getElementById('home').onclick = home;
  document.getElementById('home2').onclick = home;
  document.querySelectorAll('[data-z]').forEach(b => b.onclick = () => laterSheet(+b.dataset.z));
}
/* 図鑑：1語をあとまわしにする／戻す */
function laterSheet(i){
  const q = QUESTIONS[i], on = isLater(i);
  const box = document.createElement('div'); box.className = 'sheet';
  box.innerHTML = `<div class="sheet-in card">
      <div class="big center">${esc(word(q))}</div><div class="full">${esc(reading(q))}</div>
      <div class="muted center" style="margin:8px 0">${on ? 'いまは「あとまわし」。戻すと練習にまた出る。' : 'あとまわしにすると、練習（確認・段・乱取り・間違えた語）に出なくなる。模試とめくり札には出る。あとまわしが残る段は達成にならない。'}</div>
      <button class="btn" id="lt">${on ? '練習に戻す' : 'あとまわしにする'}</button>
      <button class="btn sub" id="lc">やめる</button></div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.onclick = e => { if(e.target === box) close(); };
  box.querySelector('#lc').onclick = close;
  box.querySelector('#lt').onclick = () => { if(on) delete S.later[i]; else S.later[i] = today(); save(); close(); const y = window.scrollY; zukan(); window.scrollTo(0, y); };
}
function confetti(){
  clearFx();
  const box = document.createElement('div'); box.className = 'confetti'; fxBox = box;
  const cs = getComputedStyle(document.documentElement);
  const colors = ['--shu', '--kin', '--ink', '--shu'].map(v => cs.getPropertyValue(v).trim());   // 朱・金・墨（テーマに合わせる）
  for(let k = 0; k < 80; k++){
    const i = document.createElement('i');
    i.style.left = Math.random() * 100 + 'vw';
    i.style.background = colors[k % colors.length];
    i.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    i.style.animationDelay = Math.random() * .6 + 's';
    box.appendChild(i);
  }
  document.body.appendChild(box); setTimeout(() => { if(fxBox === box) clearFx(); }, 4500);
}
home();
</script>
