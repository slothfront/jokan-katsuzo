<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>常漢勝つぞ</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1b1f2a; --sub:#5b6475; --line:#dde1ea;
  --main:#1d4ed8; --main-ink:#ffffff; --ok:#15803d; --ok-bg:#dcfce7; --ng:#b91c1c; --ng-bg:#fee2e2;
  --gold:#b45309; --gold-bg:#fef3c7; --track:#e5e7ef;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#1a1f2a; --ink:#eef1f7; --sub:#a3acbd; --line:#2c3341;
    --main:#5b8cff; --main-ink:#0b1020; --ok:#4ade80; --ok-bg:#12331f; --ng:#f87171; --ng-bg:#3a1616;
    --gold:#fbbf24; --gold-bg:#3a2a0b; --track:#2a303d;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100dvh}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 0 2px}
.muted{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;
  background:var(--main);color:var(--main-ink);margin:10px 0;cursor:pointer;font-family:inherit}
.btn.sub{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ng{background:var(--ng);color:#fff}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px}
.row>.btn{flex:1;font-size:16px;padding:16px 6px;white-space:nowrap}
.banner{background:var(--gold-bg);color:var(--gold);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
/* 予想点メーター */
.meter{position:relative;height:22px;background:var(--track);border-radius:11px;margin:30px 0 8px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:var(--main);border-radius:11px;transition:width .6s}
.meter .pass{position:absolute;top:-24px;bottom:-4px;border-left:3px dashed var(--ng)}
.meter .pass span{position:absolute;top:0;left:4px;font-size:12px;color:var(--ng);white-space:nowrap;font-weight:700}
.big{font-size:40px;font-weight:800;line-height:1.1}
.meter.thin{height:12px;margin:10px 0 4px}
.meter .fill.ok{background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--sub)}
/* 問題 */
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--sub)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;color:var(--ink)}
.timer.low{color:var(--ng)}
.kind{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--track)}
.revive{background:var(--gold-bg);color:var(--gold)}
.q{font-size:24px;line-height:1.9;margin:14px 0 6px;word-break:break-all}
.q.solo{font-size:34px;text-align:center;margin:20px 0 14px}
.q u{text-decoration:none;border-bottom:3px solid var(--main);padding:0 2px;font-weight:800}
.ask{font-size:14px;color:var(--sub)}
input.ans{width:100%;font-size:24px;padding:14px;border-radius:12px;border:2px solid var(--line);
  background:var(--bg);color:var(--ink);font-family:inherit}
input.ans:focus{outline:none;border-color:var(--main)}
.answer{font-size:56px;font-weight:800;text-align:center;margin:8px 0;letter-spacing:.05em}
.full{text-align:center;color:var(--sub);font-size:16px}
.judge{border-radius:12px;padding:12px;margin:12px 0;font-weight:700;font-size:18px;text-align:center}
.judge.ok{background:var(--ok-bg);color:var(--ok)}
.judge.ng{background:var(--ng-bg);color:var(--ng)}
.combo{height:28px;text-align:center;font-weight:800;color:var(--gold);font-size:20px}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
/* 結果 */
.center{text-align:center}
.goal{font-size:28px;font-weight:800;color:var(--ok)}
/* ずかん */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.tile{border-radius:10px;padding:8px 2px;text-align:center;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card)}
.tile small{display:block;font-size:10px;font-weight:400;color:var(--sub)}
.tile.s2{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tile.s1{background:var(--gold-bg);color:var(--gold);border-color:transparent}
.tile.s0{background:var(--ng-bg);color:var(--ng);border-color:transparent}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hidden{display:none}
.mean{background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 6px;font-size:16px;line-height:1.6}
.mean b,.ex b{display:inline-block;font-size:12px;color:var(--sub);margin-right:8px;border:1px solid var(--line);border-radius:6px;padding:0 6px;vertical-align:1px}
.ex{background:var(--bg);border-radius:10px;padding:10px 12px;margin:10px 0 4px;font-size:16px;line-height:1.7;text-align:left}
.ex div+div{margin-top:6px}
.ex mark{background:transparent;color:var(--main);font-weight:800;border-bottom:2px solid var(--main)}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 8px}
.map button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 2px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.map button small{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-top:2px}
.map button.clr{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.map button.clr small{color:var(--ok)}
.map button.now{border:2px solid var(--main)}
.sbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);font-weight:700;margin-top:8px}
.sbar div{flex:1;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 0}
.stepper button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;font-weight:700;cursor:pointer;font-family:inherit}
.stepper b{font-size:24px;min-width:64px;text-align:center}
.seg{display:flex;background:var(--track);border-radius:12px;padding:4px;gap:4px;margin-top:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-weight:700;font-size:15px;padding:10px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ====== テストの設定（回ごとにここを差し替える） ====== */
const TEST = {
  id: 'r8-05',          // 回を変えたら変える（記録はこのidごとに分かれる）
  title: '第5回 常用漢字テスト',
  date: '2026-10-26',          // 本番の日
  full: 100,                   // 満点（本人「多分100点満点」＝20問×5点）
  pass: 30,                    // 合格点（本人「確か30点」）＝目標の最低点
  goalStep: 5,                 // 目標は5点きざみ（合格点〜満点）
  mockKaki: 15,                // 本番の書き取りの問題数（実施要項：第1〜6回は書き15問）
  mockYomi: 5,                 // 本番の読み取りの問題数（同：読み5問）
  range: 'P.76〜87・P.117〜118',

/* 問題：t='y'＝読み（a＝ひらがな・複数可）／t='k'＝書き（a＝漢字・w＝送り仮名まで入れた語）。［ ］の中が出題部分
   m＝意味（書きは問題に出すので答えの漢字を含めない）／e＝例文（答えの画面に出す）。意味と例文はClaudeが作成（2026-10-14）
   第5回＝国語科の練習用紙（表・裏の上半分＝書き152語／裏の下半分＝読み69語）から。読み69語の答えは用紙に無いのでClaudeが付けた */
const QUESTIONS = [
  {t:'k', q:"［ロテイ］", a:"露呈", w:"露呈", m:"隠れていた事実や欠点が表に出ること", e:"準備不足が本番で露呈した。"},
  {t:'k', q:"［ゴフク］", a:"呉服", w:"呉服", m:"わふく用の織物。また、着物のこと", e:"祖母は駅前で呉服店を営んでいる。"},
  {t:'k', q:"［イカク］", a:"威嚇", w:"威嚇", m:"力を見せつけておどすこと", e:"猫が毛を逆立てて犬を威嚇した。"},
  {t:'k', q:"［ユイイツ］", a:"唯一", w:"唯一", m:"ただひとつだけであること", e:"彼女はクラスで唯一の皆勤賞だった。"},
  {t:'k', q:"［キョウカツ］", a:"恐喝", w:"恐喝", m:"おどして金品をうばい取ること", e:"恐喝は重い犯罪だと公民の授業で学んだ。"},
  {t:'k', q:"［キョウサ］", a:"教唆", w:"教唆", m:"他人をそそのかして悪いことをさせること", e:"犯罪を教唆した者も罰せられる。"},
  {t:'k', q:"［ギンミ］", a:"吟味", w:"吟味", m:"内容や品質を念入りに調べること", e:"材料を吟味して文化祭のメニューを決めた。"},
  {t:'k', q:"［サンカ］", a:"傘下", w:"傘下", m:"大きな組織の支配や指導を受ける立場にあること", e:"その会社は大手グループの傘下に入った。"},
  {t:'k', q:"［ムショウ］", a:"無償", w:"無償", m:"代金や報酬を受け取らないこと。ただ", e:"義務教育の教科書は無償で配られる。"},

  {t:'k', q:"［コウボク］", a:"公僕", w:"公僕", m:"国民全体に奉仕する者。役人のこと", e:"公務員は国民の公僕であるといわれる。"},
  {t:'k', q:"［ケッシュツ］", a:"傑出", w:"傑出", m:"ほかより飛び抜けてすぐれていること", e:"彼のサーブ力はチームの中でも傑出している。"},
  {t:'k', q:"［ヘンケン］", a:"偏見", w:"偏見", m:"かたよったものの考え方", e:"偏見を持たずに相手の話を聞こう。"},
  {t:'k', q:"［タンテイ］", a:"探偵", w:"探偵", m:"ひそかに人の事情や事件を調べること。また、その人", e:"推理小説の探偵が鮮やかに事件を解いた。"},

  {t:'k', q:"［タダ］し", a:"但", w:"但し", m:"そうではあるが。条件や例外を付け加えるときの語", e:"明日の練習は自由参加です。但し、事前に連絡すること。"},
  {t:'k', q:"［センニン］", a:"仙人", w:"仙人", m:"山奥に住み、不思議な力を持つとされる者", e:"山にこもって暮らす仙人の昔話を読んだ。"},
  {t:'k', q:"［ミサキ］", a:"岬", w:"岬", m:"海や湖に突き出た陸地の先端", e:"岬の灯台から房総の海を眺めた。"},
  {t:'k', q:"［ダキョウ］", a:"妥協", w:"妥協", m:"対立する意見をゆずり合って折り合いをつけること", e:"話し合いの末、両方が妥協して案がまとまった。"},
  {t:'k', q:"［モウソウ］", a:"妄想", w:"妄想", m:"根拠のないことを事実のように思い込むこと", e:"試験前に悪い妄想ばかりせず、準備をしよう。"},
  {t:'k', q:"［チャクナン］", a:"嫡男", w:"嫡男", m:"家をつぐ長子。あととりのむすこ", e:"戦国武将の嫡男として育てられた。"},
  {t:'k', q:"［キゲン］", a:"機嫌", w:"機嫌", m:"気分のよしあし", e:"試合に勝って監督は上機嫌だった。"},
  {t:'k', q:"［バイタイ］", a:"媒体", w:"媒体", m:"情報を伝える手段。メディア", e:"新聞やテレビは情報を伝える媒体だ。"},
  {t:'k', q:"［ニンシン］", a:"妊娠", w:"妊娠", m:"体内に子どもを宿すこと", e:"保健の授業で妊娠と出産のしくみを学んだ。"},
  {t:'k', q:"［インゾク］", a:"姻族", w:"姻族", m:"結婚によってできる親類", e:"配偶者の両親は姻族にあたる。"},
  {t:'k', q:"［ニンプ］", a:"妊婦", w:"妊婦", m:"おなかに子どもを宿している女性", e:"電車で妊婦の方に席をゆずった。"},
  {t:'k', q:"［オウヒ］", a:"王妃", w:"王妃", m:"君主のつま", e:"世界史の資料集に王妃の肖像画が載っている。"},

  {t:'k', q:"［ソウシツ］", a:"喪失", w:"喪失", m:"なくすこと", e:"連敗で自信を喪失しないように声をかけた。"},
  {t:'k', q:"［シンオン］", a:"唇音", w:"唇音", m:"くちびるを使って出すおと（「ぱ」「ば」「ま」など）", e:"「ぱ」「ば」「ま」の子音は唇音だ。"},
  {t:'k', q:"［ユウカイ］", a:"誘拐", w:"誘拐", m:"人をだまして連れ去ること", e:"防犯教室で誘拐から身を守る方法を学んだ。"},
  {t:'k', q:"［フヨウ］", a:"扶養", w:"扶養", m:"生活の面倒を見てやしなうこと", e:"親は子を扶養する義務がある。"},
  {t:'k', q:"［ハアク］", a:"把握", w:"把握", m:"しっかりと理解すること", e:"担任としてクラスの状況を把握する。"},
  {t:'k', q:"［ショウホン］", a:"抄本", w:"抄本", m:"もとの書類の一部を抜き書きしたもの", e:"戸籍抄本を市役所で受け取った。"},
  {t:'k', q:"［ケネン］", a:"懸念", w:"懸念", m:"気にかかって心配すること", e:"雨で大会が中止になる懸念がある。"},
  {t:'k', q:"［チョウバツ］", a:"懲罰", w:"懲罰", m:"不正や違反をこらしめること", e:"規則を破った選手に懲罰が科された。"},
  {t:'k', q:"［コンダン］", a:"懇談", w:"懇談", m:"打ち解けて親しく話し合うこと", e:"保護者との懇談会が放課後に開かれた。"},

const EXTEND_MIN = [1, 3, 5];   // 時間切れのときに選べる延長
const REVIVE_GAP = 3;        // 間違えた問題は3問あとに「復活戦」で出す
const SKIP_AFTER = 5;        // 同じ語を今日この回数つづけて間違えたら「次は行ける／今日はスキップ」を選ばせる
const STAGE_SIZE = 20;       // 1ステージの語数の目安（範囲を等分する）

/* ステージ：書き・読みをそれぞれ用紙の順に約20語ずつ区切る。
   「ぜんぶ」のときは書き2つ→読み1つの割合で並べる（本番の15：5に近い） */
function makeStages(){
  const split = (t, name) => {
    const ix = QUESTIONS.map((q, i) => q.t === t ? i : -1).filter(i => i >= 0);
    const n = Math.max(1, Math.ceil(ix.length / STAGE_SIZE)), out = [];
    for(let k = 0; k < n; k++){
      const a = Math.round(ix.length * k / n), b = Math.round(ix.length * (k + 1) / n);
      out.push({id: t + (k + 1), t, name: name + (k + 1), ix: ix.slice(a, b), at: (k + 1) / n});
    }
    return out;
  };
  return [...split('k', '書き'), ...split('y', '読み')].sort((a, b) => a.at - b.at || (a.t === 'k' ? -1 : 1));
}
const STAGES = makeStages();
const KEY = 'jokan:' + TEST.id;

/* ---------- 記録（このスマホの中だけ） ---------- */
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.items) return s; }catch(e){}
  return {items:{}, days:[], mockBest:null, sessions:0};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();
if(!['all','k','y'].includes(S.only)) S.only = 'all';   // トレーニングで出す種類（ぜんぶ／書きだけ／読みだけ）
if(!(S.min >= 1 && S.min <= 30)) S.min = 10;            // トレーニングの時間（分・1〜30）
if(!S.stages) S.stages = {};                              // ステージの進み具合 {id: {done:[問題番号], miss, cleared, perfect}}
const sg = id => S.stages[id] || (S.stages[id] = {done:[], miss:0, cleared:false, perfect:false});
const stageById = id => STAGES.find(x => x.id === id);
const myStages = () => STAGES.filter(x => S.only === 'all' || x.t === S.only);
/* 目標：生徒が自分で決める（合格点〜満点・5点きざみ）。未設定なら最初に聞く */
const clampGoal = g => Math.min(TEST.full, Math.max(TEST.pass, Math.round(g / TEST.goalStep) * TEST.goalStep));
const goal = () => clampGoal(S.goal || TEST.pass);
if(!S.skip) S.skip = {};                                  // 明日覚える字 {問題番号: スキップした日}
const skippedToday = i => S.skip[i] === today();          // 今日はもう出さない
const revenge = i => !!S.skip[i] && S.skip[i] < today();  // 前の日にスキップした字＝リベンジ（最初に出す）
const revengeFirst = ix => [...ix.filter(revenge), ...ix.filter(i => !revenge(i))];
/* ステージに今日出せる語が残っているか */
const stageOpen = x => x.ix.some(i => !sg(x.id).done.includes(i) && !skippedToday(i));
function nextStage(){ return myStages().find(x => !sg(x.id).cleared && stageOpen(x)) || null; }
const st = i => S.items[i] || (S.items[i] = {seen:0, ok:0, streak:0, last:null});

/* 覚えた＝2回続けて正解／あと少し＝直近が正解／苦手＝直近が不正解 */
function level(i){
  const s = S.items[i];
  if(!s || !s.seen) return -1;
  if(s.streak >= 2) return 2;
  if(s.streak === 1) return 1;
  return 0;
}
/* 達成度：範囲の語のうち、1回でも正解したことのある語の割合（％）。下がらない数字にしてある */
function achieved(){ return QUESTIONS.filter((_, i) => S.items[i] && S.items[i].ok > 0).length; }
function achievedPct(){ return Math.floor(achieved() / QUESTIONS.length * 100); }
function mastered(){ return QUESTIONS.filter((_, i) => level(i) === 2).length; }
function almost(){ return QUESTIONS.filter((_, i) => level(i) === 1).length; }
function today(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function streakDays(){
  const set = new Set(S.days); let n = 0; const d = new Date();
  if(!set.has(today())) d.setDate(d.getDate()-1);   // 今日まだなら昨日から数える
  while(true){
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!set.has(k)) break; n++; d.setDate(d.getDate()-1);
  }
  return n;
}
function daysLeft(){
  const t = new Date(TEST.date + 'T00:00:00'); const n = new Date(); n.setHours(0,0,0,0);
  return Math.round((t - n) / 86400000);
}
function record(i, ok){
  const s = st(i); s.seen++; s.last = Date.now();
  // 「覚えた」は別の回で2回続けて正解したとき。同じ回の中で何度正解しても連続は1つしか進めない
  if(ok){ s.ok++; if(!(R && R.counted.has(i))) s.streak++; } else { s.streak = 0; }
  if(s.wrDay !== today()){ s.wr = 0; s.wrDay = today(); }   // 今日の連続まちがい
  s.wr = ok ? 0 : (s.wr || 0) + 1;
  if(ok && revenge(i)) delete S.skip[i];                     // リベンジ成功
  if(R) R.counted.add(i);
  if(!S.days.includes(today())) S.days.push(today());
  save();
}

/* ---------- 文字の扱い ---------- */
function norm(x){
  return String(x).normalize('NFKC')
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s。、．，.,・]/g, '');
}
function esc(x){ return String(x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sentence(q){ return esc(q).replace(/［(.+?)］/g, '<u>$1</u>'); }
function solo(q){ return /^［[^］]+］[ぁ-ゖ]*$/.test(q) ? ' solo' : ''; }
function filled(item){   // 書きの答えを入れた文（カタカナ部分を漢字に置き換え）
  if(item.t !== 'k') return item.q.replace(/［|］/g,'');
  return item.q.replace(/［.+?］/, item.a);
}
function extra(item){
  if(!item.m && !item.e) return '';
  const word = item.t === 'y' ? item.q.replace(/［|］/g, '') : (item.w || item.a);
  let ex = item.e ? esc(item.e) : '';
  for(const k of [word, item.a].filter(x => typeof x === 'string')){
    if(item.e && item.e.includes(k)){ ex = esc(item.e).replace(esc(k), '<mark>' + esc(k) + '</mark>'); break; }
  }
  return `<div class="ex">${item.m ? `<div><b>意味</b>${esc(item.m)}</div>` : ''}${ex ? `<div><b>例文</b>${ex}</div>` : ''}</div>`;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    const g = sg(b.dataset.st);
    if(g.cleared){ g.done = []; g.miss = 0; save(); }   // クリア済みはやり直し（クリアの記録は残す）
    startRun('train', b.dataset.st);
  });
  document.getElementById('mock').onclick = () => startRun('mock');
  document.getElementById('zukan').onclick = zukan;
  document.getElementById('goal').onclick = () => goalScreen(false);
}
/* 目標を決める画面（最初に開いたとき／トップの「目標を変える」） */
function goalScreen(first){
  stopTimer();
  let g = clampGoal(S.goal || TEST.pass);
  app.innerHTML = `<h1>🎯 目標を決めよう</h1>
    <div class="card center">
      <div>${esc(TEST.title)}で、何点をめざす？</div>
      <div class="stepper" style="margin:18px 0 6px">
        <button id="gm" aria-label="5点さげる">−</button>
        <b id="gv" style="font-size:40px;min-width:120px">${g}点</b>
        <button id="gp" aria-label="5点あげる">＋</button>
      </div>
      <div class="muted">${TEST.pass}点〜${TEST.full}点（${TEST.goalStep}点きざみ）・あとから変えられる</div>
    </div>
    <button class="btn" id="ok">これでいく！</button>
    ${first ? '' : '<button class="btn sub" id="back">もどる</button>'}`;
  const set = d => { g = clampGoal(g + d); document.getElementById('gv').textContent = g + '点'; };
  document.getElementById('gm').onclick = () => set(-TEST.goalStep);
  document.getElementById('gp').onclick = () => set(TEST.goalStep);
  document.getElementById('ok').onclick = () => { S.goal = g; save(); home(); };
  if(!first) document.getElementById('back').onclick = home;
}

/* 出す順：苦手 → まだ出ていない → あと少し → 覚えた（それぞれの中はシャッフル） */
function trainQueue(){
  const g = {0:[], '-1':[], 1:[], 2:[]};
  QUESTIONS.forEach((q, i) => { if((S.only === 'all' || q.t === S.only) && !skippedToday(i)) g[level(i)].push(i); });
  return revengeFirst([...shuffle(g[0]), ...shuffle(g[-1]), ...shuffle(g[1]), ...shuffle(g[2])]);
}
/* 本番模試：本番と同じく書き15問・読み5問（範囲が足りなければある分だけ） */
function mockQueue(){
  const pick = (t, n) => shuffle(QUESTIONS.map((q, i) => q.t === t ? i : -1).filter(i => i >= 0)).slice(0, n);
  return shuffle([...pick('k', TEST.mockKaki), ...pick('y', TEST.mockYomi)]);
}

/* ステージの出題：まだ正解していない語をシャッフル */
function stageQueue(id){
  const g = sg(id);
  return revengeFirst(shuffle(stageById(id).ix.filter(i => !g.done.includes(i) && !skippedToday(i))));
}
/* ランダム：選んでいる種類（ぜんぶ／書きだけ／読みだけ）の全語をシャッフル */
function myIdx(){ return QUESTIONS.map((q, i) => (S.only === 'all' || q.t === S.only) ? i : -1).filter(i => i >= 0); }
function randomQueue(){ return revengeFirst(shuffle(myIdx().filter(i => !skippedToday(i)))); }
function randName(){ return ({all:'ぜんぶ', k:'書き', y:'読み'})[S.only] + 'ランダム'; }
/* 一周したときの補充：ランダムは並べ直し、復習モードは覚えていない字から */
function refill(){
  if(R.random) return randomQueue();
  const more = trainQueue().filter(i => level(i) < 2);
  return more.length ? more : trainQueue();
}
function setStage(id, random){   // id=null で復習モード／random=true でランダム
  R.stage = id; R.random = !id && !!random;
  R.queue = (id ? stageQueue(id) : R.random ? randomQueue() : trainQueue()).map(i => ({i, revive:false}));
  R.pos = 0;
}

let R = null;   // 実行中の回
function startRun(mode, stageId, random){
  const before = achievedPct();
  R = {mode, stage:null, clears:[], queue: mode === 'train' ? [] : mockQueue().map(i => ({i, revive:false})),
       pos:0, counted:new Set(), right:0, total:0, combo:0, maxCombo:0, before, masteredBefore: mastered(),
       end: Date.now() + S.min * 60000, minutes: S.min, timeUp:false};
  if(mode === 'train'){
    setStage(stageId || null, random);
    timerId = setInterval(tick, 250);
  }
  show();
}
function clock(){
  const sec = Math.max(0, Math.ceil((R.end - Date.now()) / 1000));
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
function tick(){
  const t = document.getElementById('timer'); if(!t) return;
  const sec = Math.max(0, Math.ceil((R.end - Date.now()) / 1000));
  t.textContent = clock();
  t.classList.toggle('low', sec <= 10);
  if(sec === 0){ R.timeUp = true; stopTimer(); }
}
function header(cur){
  const left = R.mode === 'train'
    ? `<span class="timer" id="timer">${clock()}</span>`
    : `<span>${R.pos + 1} / ${R.queue.length}</span>`;
  const kind = cur.revive ? '<span class="kind revive">復活戦</span>'
             : revenge(cur.i) ? '<span class="kind revive">リベンジ</span>'
             : `<span class="kind">${QUESTIONS[cur.i].t === 'y' ? '読み' : '書き'}</span>`;
  return `<div class="top">${left}${kind}<button class="btn sub" style="width:auto;margin:0;padding:6px 12px;font-size:14px" id="quit">やめる</button></div>
          ${R.stage ? stageBar() : R.random ? `<div class="sbar"><span>🎲 ${randName()}（${myIdx().length}語）</span></div>` : ''}
          <div class="combo" id="combo">${R.combo >= 2 ? R.combo + 'コンボ！' : ''}</div>`;
}
function stageBar(){
  const x = stageById(R.stage), d = sg(R.stage).done.length;
  return `<div class="sbar"><span>${esc(x.name)}</span><div><i style="width:${d / x.ix.length * 100}%"></i></div><span>${d}/${x.ix.length}</span></div>`;
}
function show(){
  if(R.mode === 'train' && R.timeUp) return askExtend();
  if(R.mode === 'train') while(R.pos < R.queue.length && skippedToday(R.queue[R.pos].i)) R.pos++;
  if(R.mode === 'train' && R.stage && R.pos >= R.queue.length){
    setStage(R.stage);                                   // 念のため（通常はクリアで抜ける）
    if(!R.queue.length) return stageRest();              // 残りが明日覚える字だけ
  }
  if(R.mode === 'train' && !R.stage && R.pos >= R.queue.length && !R.timeUp) R.queue.push(...refill().map(i => ({i, revive:false})));
  if(R.pos >= R.queue.length) return result();
  const cur = R.queue[R.pos], item = QUESTIONS[cur.i];
  if(item.t === 'y'){
    app.innerHTML = `${header(cur)}
      <div class="card">
        <div class="ask">線の部分の読みを、ひらがなで</div>
        <div class="q${solo(item.q)}">${sentence(item.q)}</div>
        <form id="f" autocomplete="off">
          <input class="ans" id="in" inputmode="text" lang="ja" enterkeyhint="done" placeholder="ひらがなで入力">
          <button class="btn" type="submit">こたえる</button>
        </form>
        <button class="btn sub" id="pass">わからない</button>
      </div>`;
    const inp = document.getElementById('in');
    inp.focus();
    inp.addEventListener('keydown', e => { if(e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault(); });
    document.getElementById('f').onsubmit = e => {
      e.preventDefault();
      const v = norm(inp.value); if(!v) return;
      answered(item.a.some(a => norm(a) === v), inp.value);
    };
    document.getElementById('pass').onclick = () => answered(false, '');
  }else{
    app.innerHTML = `${header(cur)}
      <div class="card">
        <div class="ask">線のカタカナを漢字にすると？ 頭の中で書いてから、答えを見よう</div>
        <div class="q${solo(item.q)}">${sentence(item.q)}</div>
        ${item.m ? `<div class="mean"><b>意味</b>${esc(item.m)}</div>` : ''}
        <button class="btn" id="open">答えを見る</button>
      </div>`;
    document.getElementById('open').onclick = () => {
      app.querySelector('.card').innerHTML = `
        <div class="q${solo(item.q)}">${sentence(item.q)}</div>
        <div class="answer">${esc(item.w || item.a)}</div>
        ${item.w ? '' : `<div class="full">${esc(filled(item))}</div>`}
        ${extra(item)}
        <div class="row" style="margin-top:12px">
          <button class="btn ok" id="y">わかった</button>
          <button class="btn ng" id="n">わからなかった</button>
        </div>`;
      document.getElementById('y').onclick = () => next(true);
      document.getElementById('n').onclick = () => next(false);
    };
  }
  document.getElementById('quit').onclick = () => { if(R.total === 0) return home(); result(); };
  if(R.mode === 'train') tick();
}
function answered(ok, typed){
  const item = QUESTIONS[R.queue[R.pos].i];
  const card = app.querySelector('.card');
  card.innerHTML = `
    <div class="q${solo(item.q)}">${sentence(item.q)}</div>
    <div class="judge ${ok ? 'ok' : 'ng'}">${ok ? '○ 正解！' : (typed ? `× 「${esc(typed)}」ではなく` : '答えは')}</div>
    ${ok ? `<div class="full">${item.a.map(esc).join(' ／ ')}</div>` : `<div class="answer" style="font-size:36px">${item.a.map(esc).join('<span class="muted"> ／ </span>')}</div>`}
    ${extra(item)}
    <button class="btn" id="nx">つぎへ</button>`;
  const b = document.getElementById('nx'); b.focus();
  b.onclick = () => next(ok, true);
  bump(ok);
}
function bump(ok){
  const c = document.getElementById('combo');
  const n = ok ? R.combo + 1 : 0;
  if(c){ c.textContent = n >= 2 ? n + 'コンボ！' : ''; if(n >= 2){ c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); } }
  if(ok && navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
}
function next(ok, alreadyBumped){
  const cur = R.queue[R.pos];
  // 復活戦での正解は「あと少し」止まり（覚えたにはしない）
  if(cur.revive && ok){ record(cur.i, true); st(cur.i).streak = 1; save(); }
  else record(cur.i, ok);
  R.total++;
  if(ok){ R.right++; R.combo++; R.maxCombo = Math.max(R.maxCombo, R.combo); } else R.combo = 0;
  if(!alreadyBumped) bump(ok);
  if(!ok && R.mode === 'train'){
    R.queue.splice(Math.min(R.pos + 1 + REVIVE_GAP, R.queue.length), 0, {i:cur.i, revive:true});
    if(st(cur.i).wr >= SKIP_AFTER) return askSkip(cur.i, ok);
  }
  afterAnswer(cur, ok);
}
/* 同じ語を今日5回つづけて間違えた：「次は行ける」か「今日はスキップ（明日覚える）」を選ぶ */
function askSkip(i, ok){
  const q = QUESTIONS[i], w = q.t === 'y' ? q.q.replace(/［|］/g, '') : (q.w || q.a);
  app.innerHTML = `<h1>😵 ${SKIP_AFTER}回つづけてまちがえた</h1>
    <div class="card center">
      <div class="big">${esc(w)}</div>
      ${q.t === 'y' ? `<div class="full">${q.a.map(esc).join(' ／ ')}</div>` : ''}
      ${extra(q)}
      <div style="margin-top:8px">この字、どうする？</div>
    </div>
    <button class="btn" id="go2">💪 次は行ける！</button>
    <button class="btn sub" id="skip">🌙 今日はスキップ（明日覚える）</button>`;
  document.getElementById('go2').onclick = () => { st(i).wr = 0; save(); afterAnswer(R.queue[R.pos], ok); };
  document.getElementById('skip').onclick = () => {
    S.skip[i] = today(); save();
    R.queue = R.queue.filter((e, k) => k <= R.pos || e.i !== i);   // この先の出番を消す
    R.skipped = (R.skipped || 0) + 1;
    afterAnswer(R.queue[R.pos], ok);
  };
}
function afterAnswer(cur, ok){
  R.pos++;
  if(R.mode === 'train' && R.stage){
    const g = sg(R.stage), x = stageById(R.stage);
    if(ok){ if(!g.done.includes(cur.i)) g.done.push(cur.i); } else g.miss++;
    save();
    if(g.done.length >= x.ix.length) return stageClear();
  }
  // 復習モードで全部出し切ったら、覚えていない問題からもう一周
  if(R.mode === 'train' && !R.stage && R.pos >= R.queue.length && !R.timeUp){
    R.queue.push(...refill().map(i => ({i, revive:false})));
  }
  show();
}
/* ステージの残りが「明日覚える字」だけになった：次のステージへ進める */
function stageRest(){
  stopTimer();
  const x = stageById(R.stage), g = sg(R.stage), rest = x.ix.filter(i => !g.done.includes(i)).length;
  const left = Math.max(0, R.end - Date.now()), nx = nextStage();
  app.innerHTML = `<h1>🌙 ${esc(x.name)}は今日ここまで</h1>
    <div class="card center">
      <div>${x.ix.length - rest}/${x.ix.length}語 正解！</div>
      <div class="muted">残り${rest}語は明日覚える字。明日いちばん先に出るよ</div>
    </div>
    <button class="btn" id="nx">${nx ? `次へ：${esc(nx.name)}` : '復習モードへ'}${left > 0 ? `（残り ${clock()}）` : ''}</button>
    <button class="btn sub" id="fin">終わる</button>`;
  document.getElementById('nx').onclick = () => {
    R.end = Date.now() + left; R.timeUp = left <= 0;
    setStage(nx ? nx.id : null);
    if(!R.timeUp) timerId = setInterval(tick, 250);
    show();
  };
  document.getElementById('fin').onclick = result;
}
/* ステージクリア：タイマーを止めて祝う。続けるなら残り時間から再開 */
function stageClear(){
  stopTimer();
  const x = stageById(R.stage), g = sg(R.stage);
  const first = !g.cleared;
  g.cleared = true; if(g.miss === 0) g.perfect = true; save();
  R.clears.push(x.name);
  const left = Math.max(0, R.end - Date.now()), nx = nextStage();
  app.innerHTML = `<h1>🎉 ステージクリア！</h1>
    <div class="card center">
      <div class="big pop">${esc(x.name)}</div>
      <div style="margin-top:6px">${x.ix.length}語 ぜんぶ正解！</div>
      ${g.miss === 0 ? '<div class="goal">👑 ノーミス！</div>' : `<div class="muted">まちがい ${g.miss}回 → 次はノーミスで👑</div>`}
      ${first ? '' : '<div class="muted">（やり直しクリア）</div>'}
    </div>
    <button class="btn" id="nx">${nx ? `次へ：${esc(nx.name)}` : '復習モードへ'}${left > 0 ? `（残り ${clock()}）` : ''}</button>
    <button class="btn sub" id="fin">終わる</button>`;
  confetti();
  document.getElementById('nx').onclick = () => {
    R.end = Date.now() + left; R.timeUp = left <= 0;
    setStage(nx ? nx.id : null);
    if(!R.timeUp) timerId = setInterval(tick, 250);
    show();
  };
  document.getElementById('fin').onclick = result;
}
/* 時間切れ：延長するか聞く（解いていた問題が終わってから出る） */
function askExtend(){
  stopTimer();
  app.innerHTML = `<h1>⏰ 時間です！</h1>
    <div class="card center">
      <div class="muted">ここまで（${R.minutes}分）</div>
      ${R.stage ? `<div style="margin:6px 0">${stageBar()}</div>` : ''}
      <div class="big">${R.right}<span style="font-size:20px"> / ${R.total}問 正解</span></div>
      <div style="margin-top:6px">延長する？</div>
    </div>
    <div class="row">${EXTEND_MIN.map(m => `<button class="btn" data-m="${m}">もう${m}分</button>`).join('')}</div>
    <button class="btn sub" id="fin">終わる</button>`;
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const m = +b.dataset.m;
    R.end = Date.now() + m * 60000; R.minutes += m; R.timeUp = false;
    if(R.pos >= R.queue.length && !R.stage){
      R.queue.push(...refill().map(i => ({i, revive:false})));
    }
    timerId = setInterval(tick, 250);
    show();
  });
  document.getElementById('fin').onclick = result;
}
function result(){
  stopTimer();
  const after = achievedPct(), gained = mastered() - R.masteredBefore;
  let body = '';
  if(R.mode === 'mock'){
    const score = Math.round(TEST.full * R.right / Math.max(1, R.queue.length));
    const done = R.total === R.queue.length;
    const best = S.mockBest;
    if(done && (best === null || score > best)){ S.mockBest = score; save(); }
    const passed = done && score >= goal();
    body = `
      <div class="muted">本番模試（${R.queue.length}問・${TEST.full}点満点に換算）${done ? '' : '※途中でやめたので記録しません'}</div>
      <div class="big">${score}<span style="font-size:20px">点</span></div>
      ${passed ? `<div class="goal pop">🎯 目標${goal()}点 達成！</div>` : `<div>目標${goal()}点まで あと <b>${Math.max(0, goal() - score)}点</b></div>`}
      ${done && best !== null && score > best ? `<div class="goal" style="font-size:20px">自己ベスト更新！（${best}点 → ${score}点）</div>` : ''}`;
    if(passed) confetti();
  }else{
    body = `
      <div class="muted">今日の${R.minutes}分</div>
      <div class="big">${R.right}<span style="font-size:20px"> / ${R.total}問 正解</span></div>
      <div>最高 <b>${R.maxCombo}</b> コンボ</div>
      ${R.skipped ? `<div class="muted">🌙 明日覚える字 ${R.skipped}語</div>` : ''}
      ${R.clears.length ? `<div class="goal" style="font-size:20px;margin-top:6px">クリア：${R.clears.map(esc).join('・')}</div>` : ''}
      ${R.stage && !sg(R.stage).cleared ? `<div style="margin-top:6px">${stageBar()}</div><div class="muted">続きは次の回から</div>` : ''}
      <div style="margin-top:8px">覚えた <b>${mastered()}</b>字（${gained >= 0 ? '+' : ''}${gained}）・あと少し <b>${almost()}</b>字</div>
      <div class="muted">あと少しの字は、次の回でも正解すると「覚えた」になる</div>
      <div>達成度 ${R.before}% → <b>${after}%</b>${after > R.before ? ` <span class="goal" style="font-size:16px">+${after - R.before}</span>` : ''}</div>
      ${after === 100 && R.before < 100 ? '<div class="goal pop">🎉 範囲の語をぜんぶ1回は正解した！</div>' : ''}`;
    if(after === 100 && R.before < 100) confetti();
  }
  app.innerHTML = `<h1>おつかれさま！</h1><div class="card center">${body}</div>
    <button class="btn" id="home">トップへ</button>`;
  document.getElementById('home').onclick = home;
  R = null;
}
function zukan(){
  const tiles = QUESTIONS.map((q, i) => {
    const l = level(i), w = q.t === 'y' ? q.q.match(/［(.+?)］/)[1] : (q.w || q.a);
    return `<div class="tile s${l}">${esc(w)}<small>${q.t === 'y' ? '読み' : '書き'}${skippedToday(i) ? '・🌙明日' : revenge(i) ? '・💪' : ''}</small></div>`;
  }).join('');
  app.innerHTML = `<h1>ずかん</h1>
    <div class="legend"><span><i style="background:var(--ok-bg)"></i>覚えた</span><span><i style="background:var(--gold-bg)"></i>あと少し</span>
      <span><i style="background:var(--ng-bg)"></i>苦手</span><span><i style="border:1px solid var(--line)"></i>まだ</span></div>
    <div class="grid">${tiles}</div>
    <button class="btn" id="home">トップへ</button>`;
  document.getElementById('home').onclick = home;
}
function confetti(){
  const box = document.createElement('div'); box.className = 'confetti';
  const colors = ['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899'];
  for(let k = 0; k < 80; k++){
    const i = document.createElement('i');
    i.style.left = Math.random() * 100 + 'vw';
    i.style.background = colors[k % colors.length];
    i.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    i.style.animationDelay = Math.random() * .6 + 's';
    box.appendChild(i);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4500);
}
home();
</script>
</body>
